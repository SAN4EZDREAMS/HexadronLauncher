distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.5.1-bin.zip
#
# Завантаження дистрибутива Gradle - єдина точка, де збірка залежить від однієї
# мережевої операції, і вона вже валила CI: "Attempt 1/1 failed. Reason:
# Connection reset". Одна спроба тому, що retries стояло на нулі -
# org/gradle/wrapper/Install читає саме ці два ключі й формує з них рядок
# "Attempt %d/%d". Скинутий TLS-хендшейк на сотні мегабайт архіву - річ звичайна,
# і повторна спроба тут коштує кілька секунд проти червоної збірки без жодної
# причини в коді.
#
# networkTimeout - це і connect, і read timeout. Десять секунд на read для
# такого архіву замало: підвислий на секунду канал уже вважався розривом. Хвилина
# з чотирма спробами лишається далеко в межах timeout-minutes: 15 у workflow.
#
# УВАГА: ./gradlew wrapper перегенерує цей файл і зітре ці коментарі разом зі
# значеннями. Після оновлення версії Gradle їх треба повернути.
networkTimeout=60000
retries=3
retryBackOffMs=2000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
