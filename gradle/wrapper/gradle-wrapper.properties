distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.5.1-bin.zip
distributionSha256Sum=bafc141b619ad6350fd975fc903156dd5c151998cc8b058e8c1044ab5f7b031f
#
# The Gradle distribution download is the only point where the build depends on
# one network operation, and it already broke CI: "Attempt 1/1 failed. Reason:
# Connection reset". There was only one attempt because retries was zero -
# org/gradle/wrapper/Install reads exactly these two keys and builds the string
# "Attempt %d/%d" from them. A dropped TLS handshake on an archive of hundreds of
# megabytes is normal, and a retry here costs a few seconds, against a red build
# with no cause in the code.
# 
# networkTimeout is both the connect timeout and the read timeout. Ten seconds of
# read time is too short for this archive: a channel that hung for one second was
# already counted as a broken connection. One minute with four attempts stays well
# within timeout-minutes: 15 in the workflow.
#
# WARNING: ./gradlew wrapper regenerates this file and deletes these comments
# together with the values. After a Gradle version update, put them back.
networkTimeout=60000
retries=3
retryBackOffMs=2000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
