plugins {
	id 'application'
	id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'com.hexadron'
version = '0.1.0'

repositories {
	mavenCentral()
}

dependencies {
	// Перевіряємо, чи резолвиться взагалі — логіку запуску напишемо наступним кроком
	implementation 'fr.flowarg:openlauncherlib:3.2.11'
	implementation 'fr.flowarg:flowupdater:1.9.4'
	implementation 'com.google.code.gson:gson:2.11.0'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

application {
	mainClass = 'com.hexadron.launcher.Launcher'
}

tasks.named('run') {
	// Перш ніж запускати лаунчер — переконайся, що мод зібраний і свіжий
	dependsOn(':mod:build')
}

javafx {
	version = '25'
	modules = ['javafx.controls']
}
