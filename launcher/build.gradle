plugins {
	id 'application'
	id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'com.hexadron'
version = '0.2.0'

repositories {
	mavenCentral()
}

dependencies {
	// Deliberately none.
	//
	// The launch core - metadata parsing, downloads, auth, profiles, mod
	// resolution - is written against the JDK alone (java.net.http plus a small
	// JSON tree in com.hexadron.launcher.json). That keeps the whole core
	// testable with nothing but a JDK, removes third-party code from the
	// download and authentication path, and means `selfCheck` runs offline.
	//
	// The previous openlauncherlib/flowupdater pair was removed: they wrote a
	// non-standard directory layout (no versions/ folder) and could not express
	// the Forge/NeoForge installer format, which caps the project well short of
	// "every version, every loader".
	//
	// JavaFX comes from the javafx plugin below and is UI-only.
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

// The launch wrapper: one class, built into its own jar and placed on the
// game's classpath, so the Minecraft session token can be handed over standard
// input instead of on the command line - where every process on the machine can
// read it out of the process table, and where the JVM copies it verbatim into
// hs_err_pid*.log after a crash.
//
// A separate source set rather than part of the launcher jar, because the
// launcher jar also carries lang/*.properties and ui/*.css - resource paths a
// mod could plausibly claim - and because handing a modded game the launcher's
// own classes is not something to do for convenience.
sourceSets {
	wrapper {
		java {
			srcDirs = ['src/wrapper/java']
		}
	}
}

// Compiled for Java 8. This class runs inside the *game's* JVM, and Minecraft
// versions up to 1.16 run on Java 8 - a wrapper compiled for 25 would fail
// there with UnsupportedClassVersionError before the game ever started. Raise
// this only when javac stops accepting 8, and never above the oldest runtime
// the launcher still starts.
tasks.named('compileWrapperJava') {
	options.release = 8
}

tasks.register('wrapperJar', Jar) {
	group = 'build'
	description = 'Builds the launch wrapper that is placed on the game classpath.'
	archiveBaseName = 'hexadron-launchwrapper'
	archiveVersion = ''
	from sourceSets.wrapper.output
}

// Embedded in the launcher's resources. LaunchWrapperJar extracts it to the
// data folder on first launch, and re-extracts it whenever its hash changes.
tasks.named('processResources') {
	dependsOn tasks.named('wrapperJar')
	from(tasks.named('wrapperJar')) {
		into 'wrapper'
	}
}

application {
	mainClass = 'com.hexadron.launcher.Launcher'
}

javafx {
	version = '25'
	modules = ['javafx.controls']
}

// Verifies the metadata layer: JSON parsing, rule evaluation, library dialects,
// inheritsFrom merging, classpath order, argument substitution, account UUIDs.
// No network and no display, so it is safe in CI.
tasks.register('selfCheck', JavaExec) {
	group = 'verification'
	description = 'Runs the dependency-free self-check over the launch core.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.hexadron.launcher.SelfCheck'
}

tasks.named('check') {
	dependsOn 'selfCheck'
}

// Headless entry point:
//   ./gradlew :launcher:cli --args="versions"
//   ./gradlew :launcher:cli --args="create Test 26.2 fabric"
//   ./gradlew :launcher:cli --args="play test-abc123 Steve"
tasks.register('cli', JavaExec) {
	group = 'application'
	description = 'Runs the launcher headlessly.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.hexadron.launcher.cli.HexadronCli'
}
