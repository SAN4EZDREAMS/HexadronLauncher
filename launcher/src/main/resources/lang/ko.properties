cleanup.desc.dataRoot = 런처의 데이터 폴더입니다.
cleanup.desc.instances = 인스턴스 폴더입니다. 프로필마다 하나씩 있으며, 월드, 모드, 리소스 팩, 셰이더, 설정이 들어 있습니다. 사용자의 게임 데이터입니다.
