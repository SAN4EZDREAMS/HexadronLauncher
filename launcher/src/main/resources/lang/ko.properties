mods.curseforge.key.header = CurseForge API 키
mods.curseforge.key.body = CurseForge for Studios 콘솔에서 발급받은 Core API 키를 붙여 넣으십시오. 키는 이 컴퓨터의 launcher.json에 보관되며 CurseForge로만 전송됩니다. 입력란을 비워 두면 CurseForge가 꺼집니다.
settings.curseforge.console = console.curseforge.com 열기
settings.curseforge.howto = 발급 방법: console.curseforge.com을 열고 로그인하거나 가입한 다음 API Keys로 이동하여 키에 아무 이름이나 지정하고, 표시되는 문자열을 복사하십시오. 이 문자열은 $2a$로 시작하며 길이는 약 60자입니다. legacy.curseforge.com의 API tokens 페이지는 사용하지 마십시오. 이 페이지는 프로젝트 작성자용 32자 업로드 토큰을 발급하며, api.curseforge.com은 모든 요청에서 HTTP 403으로 이 토큰을 거부합니다.
mods.curseforge.key.wrongKind = 업로드 API 토큰으로 보입니다. legacy.curseforge.com/account/api-tokens에서 발급된 32자리 16진수 문자열입니다. 이 토큰은 본인이 소유한 프로젝트에 파일을 업로드하는 용도이며, api.curseforge.com은 별개의 서비스이므로 모든 요청에서 HTTP 403으로 이 토큰을 거부합니다.\n\n런처에 필요한 것은 console.curseforge.com에서 발급하는 Core API 키입니다. 그곳에 로그인하여 API Keys를 열고 키 이름을 지정한 다음, 표시되는 문자열을 복사하십시오. 이 문자열은 $2a$로 시작하며 길이는 약 60자입니다.
