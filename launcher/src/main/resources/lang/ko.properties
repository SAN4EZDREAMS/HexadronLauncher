auth.problem.noUsername.purchased = 이 계정에는 Minecraft: Java Edition이 있지만 아직 플레이어 이름을 만들지 않았습니다.\n\n공식 Minecraft Launcher를 열고 이 계정으로 로그인한 뒤 플레이어 이름을 만드세요. 그런 다음 여기에서 다시 로그인하세요.
auth.problem.noUsername.gamePass = 이 계정은 Game Pass로 Minecraft를 이용할 수 있지만 아직 Java Edition 프로필이 없습니다.\n\n1. Game Pass 구독이 활성 상태이고 결제되었는지 확인하세요: {1}\n2. 플레이어 이름을 만들려면 공식 Minecraft Launcher에서 Minecraft: Java Edition을 한 번 실행하세요.\n\n그런 다음 여기에서 다시 로그인하세요.
auth.problem.otherGamesOnly = 이 Microsoft 계정에는 다른 Minecraft 게임(예: Bedrock Edition)은 있지만 Java Edition이 없고 활성 Game Pass도 없습니다.\n\n• Game Pass로 플레이했다면: 구독이 만료되었거나 결제되지 않았습니다. 갱신하세요: {1}\n• Java Edition을 구매했다면: 다른 Microsoft 계정에 있습니다. 다시 로그인하고 그 계정을 선택하세요.
auth.problem.noLicence = 이 Microsoft 계정에는 Minecraft: Java Edition이 없습니다. 이 계정에서 게임을 구매하지 않았고 활성 Game Pass도 없습니다.\n\n• Game Pass로 플레이했다면: 구독이 만료되었거나 결제되지 않았습니다. 갱신하세요: {1}\n• Java Edition을 구매했다면: 다른 Microsoft 계정에 있습니다. 다시 로그인하고 그 계정을 선택하세요.
auth.problem.licenceEnded = 플레이어 이름 "{0}"은(는) 있지만, 이 계정에는 현재 Java Edition 라이선스가 없습니다. 이 계정에서 게임을 구매하지 않았고 활성 Game Pass도 없습니다.\n\nGame Pass로 플레이했다면: 구독이 만료되었거나 결제되지 않았습니다. {1}에서 갱신한 뒤 다시 로그인하세요.
