settings.tray.note = 게임이 종료되면 창이 자동으로 다시 나타납니다. 알림 아이콘에서 게임을 중지할 수도 있습니다.
settings.verify = 실행할 때마다 모든 파일 검사
settings.verify.note = 기본적으로 꺼져 있습니다. 런처는 마지막으로 해시와 대조한 이후 파일의 길이나 타임스탬프가 변경된 경우에만 파일을 다시 읽습니다. 덕분에 실행하는 데 1분이 아니라 1초가 걸립니다. 이 옵션을 켜면 매번 모든 파일(최신 버전의 경우 약 5,000개)을 읽고, 네이티브 라이브러리도 jar 파일에서 다시 압축 해제합니다.

settings.modWarnings = 모드 종속성을 깨뜨리기 전에 경고
settings.modWarnings.note = 런처는 각 jar 파일이 시작하는 데 필요하다고 명시한 항목을 읽고, 다른 모드가 의존하는 항목을 끄거나 삭제하기 전에 확인을 요청합니다. 인스턴스를 해체하는 중이어서 매번 질문을 받고 싶지 않다면 이 옵션을 끄십시오.
settings.modIconCache = 모드 이미지 캐시(MB)
settings.modIconCache.note = 이미 가져온 모드 로고가 데이터 폴더에서 차지할 수 있는 용량입니다. 로고는 두 번째 시작부터 연결 없이도 목록이 표시되도록 보관됩니다. 폴더가 이 크기를 넘으면 가장 오랫동안 보지 않은 로고부터 삭제됩니다. 32 MB는 로고 약 2,000개 분량입니다. 값을 낮추면 즉시 폴더를 정리합니다.

