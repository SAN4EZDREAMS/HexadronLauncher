cleanup.desc.servers = 멀티플레이 화면의 서버 목록입니다.
cleanup.desc.scripts = 모드팩의 스크립트(KubeJS, CraftTweaker)입니다. 이 스크립트가 없으면 팩이 작동하지 않을 수 있습니다.
cleanup.desc.schematics = Litematica, WorldEdit 및 유사한 모드로 저장한 건축물입니다.
cleanup.desc.schematicFile = 저장된 건축물입니다.
cleanup.desc.loaderCache = 모드 로더가 작성한 캐시입니다. 다음 시작 시 다시 만들어집니다.
cleanup.desc.legacyResources = 아주 오래된 버전의 리소스로, 런처가 여기에 복사했습니다. 다음 시작 시 복원됩니다.
cleanup.desc.userCache = 게임에서 확인한 플레이어 이름입니다. 게임이 다시 만듭니다.
cleanup.desc.bookkeeping = 런처가 여기에 설치한 항목의 기록입니다. 삭제하면 파일은 남지만 런처로 설치하지 않은 파일로 표시됩니다.
cleanup.desc.instanceFolder = 게임이나 모드가 만든 폴더입니다.
cleanup.desc.instanceFile = 게임이나 모드가 만든 파일입니다.
cleanup.desc.versions = 설치된 Minecraft, Fabric, Quilt, Forge, NeoForge 버전입니다.
cleanup.desc.version = 버전 {0}입니다. 매니페스트와 게임 jar 파일이 들어 있습니다. 프로필에서 사용하는 버전을 삭제하면 다음 실행 시 런처가 다시 다운로드합니다.
cleanup.desc.natives = 버전별로 압축 해제된 네이티브 라이브러리입니다. 버전을 시작할 때마다 다시 압축 해제됩니다.
cleanup.desc.nativesEntry = {0}용 네이티브 라이브러리입니다. 해당 버전을 시작할 때 다시 압축 해제됩니다.
cleanup.desc.libraries = 모든 버전이 사용하는 공유 Java 라이브러리 저장소입니다.
cleanup.desc.libraryGroup = {0}의 라이브러리입니다. 버전에 필요한 라이브러리를 삭제하면 런처가 다시 다운로드합니다. Forge와 NeoForge는 다시 설치해야 할 수도 있습니다.
cleanup.desc.assets = 버전 간에 공유되는 소리, 텍스처, 번역입니다.
cleanup.desc.assetObjects = 해시로 이름이 지정된 모든 에셋 파일입니다. 모두 삭제하면 모든 버전이 에셋을 다시 다운로드합니다(버전마다 수백 MB).
cleanup.desc.asset.indexes = 에셋 인덱스입니다. 각 버전에 필요한 파일 목록입니다.
cleanup.desc.asset.indexes.entry = {0}의 에셋 목록입니다.
cleanup.desc.asset.virtual = 아주 오래된 버전을 위해 배치된 에셋 사본입니다.
cleanup.desc.asset.virtual.entry = {0}용 에셋 사본입니다.
cleanup.desc.asset.log_configs = 게임의 로깅 설정입니다.
cleanup.desc.asset.log_configs.entry = 로깅 설정 {0}.
cleanup.desc.assetOther = 기타 에셋 데이터입니다.
cleanup.desc.java = 런처가 다운로드한 Java 런타임입니다. 직접 설치한 Java는 여기에 없습니다.
cleanup.desc.javaRuntime = 런처가 다운로드한 Java {0}입니다. 이 런타임이 필요한 프로필은 다시 다운로드할지 묻습니다.
cleanup.desc.javaOther = 런처가 직접 넣지 않은, Java 디렉터리 안의 폴더입니다.
cleanup.desc.cache = 다시 다운로드하지 않도록 보관한 다운로드 파일입니다.
cleanup.desc.cacheModpacks = 설치된 모드팩의 압축 파일입니다. 팩은 이미 압축 해제되었습니다.
cleanup.desc.cacheLoaders = Forge 및 NeoForge 설치 프로그램입니다. 다시 설치할 때만 필요합니다.
cleanup.desc.cacheJava = Java를 압축 해제한 원본 압축 파일입니다.
cleanup.desc.cacheModIcons = 저장된 모드 및 팩 로고입니다.
cleanup.desc.cacheVerified = 이미 검사한 파일의 기록입니다. 삭제하면 다음 실행 시 모든 파일을 다시 검사하므로 시간이 더 걸립니다.
cleanup.desc.cacheManifest = Minecraft 버전 목록입니다. 삭제하면 다시 다운로드할 때까지 런처를 오프라인으로 시작할 수 없습니다.
cleanup.desc.cacheOther = 기타 캐시 데이터입니다. 필요할 때 다시 다운로드됩니다.
cleanup.desc.logs = 버그 보고서에 첨부하는 런처 자체의 로그입니다.
cleanup.desc.launcherLog = 이전 런처 세션의 로그입니다.
cleanup.desc.launcherLogCurrent = 지금 기록 중인 로그입니다.
cleanup.desc.other = 설정, 계정, 이미지, 런처 자체 파일입니다.
cleanup.desc.icons = 프로필용으로 선택한 이미지입니다.
cleanup.desc.iconFile = 프로필 이미지입니다.
cleanup.desc.skins = 선택한 스킨과 망토, 그리고 어느 계정이 어떤 것을 착용하는지에 대한 정보입니다.
cleanup.desc.skinFile = 추가한 스킨 또는 망토입니다.
cleanup.desc.skinsIndex = 어느 계정이 어떤 스킨을 착용하는지에 대한 기록입니다.
cleanup.desc.settingsFile = 런처 설정입니다.
cleanup.desc.accountsFile = 사용자 계정입니다. 삭제하면 다시 로그인해야 합니다.
cleanup.desc.profilesFile = 프로필 및 그룹 목록입니다. 삭제하면 모든 프로필이 런처에서 사라집니다.
cleanup.desc.secrets = 계정의 암호화된 자격 증명입니다.
cleanup.desc.wrapper = 게임에 세션을 전달하는 실행 도우미입니다.
cleanup.desc.agents = 이전 버전에서 남은 항목입니다. 지금은 사용되지 않습니다.
cleanup.desc.unknown = 런처가 인식하지 못하는 항목입니다. 다른 프로그램의 것일 수 있습니다.
cleanup.confirm.profiles = 다음 프로필도 런처 목록에서 제거됩니다: {0}
cleanup.done.profiles = 목록에서 제거된 프로필: {0}.
update.manual.flatpak = 이 런처는 Flatpak으로 설치되었으므로 스스로 교체하지 않으며, 교체는 Flatpak이 담당합니다. 새 .flatpak 파일을 다운로드하여 여십시오. 소프트웨어 센터가 런처를 그 자리에서 업데이트하며, 프로필, 월드, 계정은 유지됩니다. Flathub에서 설치했다면 그곳에서 업데이트를 실행하기만 하면 됩니다.
update.action.flatpak = .flatpak 다운로드
