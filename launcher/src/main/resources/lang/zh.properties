mods.curseforge.key.wrongKind = 这看起来是一个 Upload API 令牌：32 位十六进制字符，来自 legacy.curseforge.com/account/api-tokens。该令牌用于向你拥有的项目上传文件，而 api.curseforge.com 是另一项服务，会对每个请求返回 HTTP 403，拒绝该令牌。\n\n启动器需要的是来自 console.curseforge.com 的 Core API 密钥。请在那里登录，打开 API Keys，为密钥命名，然后复制显示的字符串：它以 $2a$ 开头，长度约为六十个字符。
