settings.grid.refusedHeader = No se cambió el tamaño de la cuadrícula
settings.grid.refusedColumns = Las columnas se quedaron en {0}: algunas instancias no habrían tenido ninguna celda a la que moverse. Primero añade una fila o mueve tú algunas instancias.
settings.grid.refusedRows = Las filas se quedaron en {0}: algunas instancias no habrían tenido ninguna celda a la que moverse. Primero añade una columna o mueve tú algunas instancias.
settings.splash = Ventana de inicio, segundos
settings.splash.note = El tiempo mínimo que permanece visible la ventana de inicio. Cero elimina el mínimo. Un clic o una tecla siempre la cierran antes.
settings.keepOpen = Mantener el launcher abierto mientras se ejecuta el juego
settings.tray = Ocultar en el área de notificaciones mientras se ejecuta el juego
settings.tray.note = La ventana vuelve sola cuando se cierra el juego. El icono de notificación también es desde donde se puede detener el juego.
settings.verify = Comprobar todos los archivos antes de cada inicio
settings.verify.note = Desactivado por defecto. El launcher vuelve a leer un archivo solo cuando su tamaño o su marca de tiempo han cambiado desde la última vez que se comprobó con su hash, y por eso un inicio tarda un segundo en lugar de un minuto. Actívalo para leerlo todo cada vez (unos cinco mil archivos en una versión moderna) y para volver a extraer las bibliotecas nativas de sus jar.

settings.modWarnings = Avisar antes de romper una dependencia de un mod
settings.modWarnings.note = El launcher lee lo que cada jar dice que necesita para iniciarse y pregunta antes de que desactives o elimines algo de lo que dependen otros mods. Desactívalo si estás desmontando una instancia y no quieres la pregunta cada vez.
settings.modIconCache = Caché de imágenes de mods, MB
settings.modIconCache.note = Cuánto espacio de la carpeta de datos pueden ocupar los logotipos de mods ya descargados. Se guardan para que la lista se muestre en el segundo inicio sin conexión; cuando la carpeta supera este tamaño, se borran primero los que nadie ha mirado desde hace más tiempo. 32 MB son unos dos mil logotipos. Si lo reduces, la carpeta se limpia en ese momento.

