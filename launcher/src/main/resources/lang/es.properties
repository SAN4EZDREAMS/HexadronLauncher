settings.curseforge.howto = Cómo conseguir una: abre console.curseforge.com, inicia sesión o regístrate y ve a API Keys; ponle cualquier nombre a la clave y copia la cadena que muestra. Empieza por $2a$ y tiene unos sesenta caracteres. NO uses la página de tokens de API de legacy.curseforge.com: esa emite un token de subida de 32 caracteres para autores de proyectos, y api.curseforge.com lo rechaza con HTTP 403 en cada petición.
mods.curseforge.key.wrongKind = Eso parece un token de Upload API: 32 caracteres hexadecimales, de legacy.curseforge.com/account/api-tokens. Ese token sube archivos a proyectos de los que eres dueño; api.curseforge.com es un servicio distinto y lo rechaza con HTTP 403 en cada petición.\n\nLo que necesita un launcher es una clave de Core API de console.curseforge.com. Inicia sesión allí, abre API Keys, ponle nombre a una clave y copia la cadena que muestra: empieza por $2a$ y tiene unos sesenta caracteres.
