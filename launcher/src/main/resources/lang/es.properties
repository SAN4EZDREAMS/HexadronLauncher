settings.signIn.note = Tu propio navegador es la forma en que debe iniciar sesión una aplicación nativa: ves la barra de direcciones y el certificado de Microsoft, y tu gestor de contraseñas y las solicitudes de verificación en dos pasos funcionan como siempre. El método del código es para un equipo sin un navegador utilizable.
settings.handshake = Pasar el token de sesión por la entrada estándar
settings.handshake.note = Activado por defecto, y debería seguir así. Cualquier programa de este equipo puede leer los argumentos de un proceso, y estos se copian en los registros de errores; la entrada estándar no. Desactívalo solo si un cargador de mods no se inicia con esta opción activada.
settings.fileStore = Guardar las credenciales en el propio archivo cifrado del launcher
