cleanup.desc.dataRoot = The launcher’s data folder.
cleanup.desc.instances = Instance folders: one per profile, with its worlds, mods, resource packs, shaders and settings. This is your game data.
cleanup.desc.profile = The game folder of profile "{0}": its worlds, mods, packs and settings. Ticked whole, the profile is removed from the launcher together with all its files, exactly like the Remove button. Tick only what is inside it to keep the profile.
cleanup.desc.orphanInstance = An instance folder no profile points to - most often a profile removed with "keep files". It can still hold worlds and mods worth keeping.
cleanup.desc.deleting = Files of deleted profiles the launcher has not finished removing. Safe to delete.
cleanup.desc.saves = Saved worlds. Deleting this deletes every world of the instance.
cleanup.desc.world = A saved world: terrain, inventory, progress. Deleted, it is gone for good.
cleanup.desc.mods = The mods of the instance. Mods installed from the catalogue can be installed again; your own jars cannot.
cleanup.desc.modFile = A mod. The instance may not start without it if other mods depend on it.
cleanup.desc.removedBin = Mods you removed, kept here where the Recycle Bin was not available.
cleanup.desc.config = Mod settings. Deleting resets every mod to its defaults.
cleanup.desc.defaultconfigs = Default settings a modpack gives new worlds.
cleanup.desc.configEntry = Settings of one mod. Deleted, the mod starts with its defaults.
cleanup.desc.resourcepacks = Resource packs: textures, sounds and models.
cleanup.desc.shaderpacks = Shader packs for Iris, OptiFine or Canvas.
cleanup.desc.packFile = A resource pack or shader pack.
cleanup.desc.screenshots = Screenshots taken in the game (F2).
cleanup.desc.screenshot = A screenshot.
cleanup.desc.gameLogs = Game logs. Useful when something crashes, otherwise safe to delete.
cleanup.desc.gameLogFile = A game log.
cleanup.desc.crashReports = Crash reports written by the game.
cleanup.desc.crashReport = A crash report. Only needed to find out why the game crashed.
cleanup.desc.options = Game settings: controls, video, sound, enabled resource packs. Deleted, the game starts with its defaults.
cleanup.desc.servers = The server list of the multiplayer screen.
cleanup.desc.scripts = Scripts of a modpack (KubeJS, CraftTweaker). The pack may not work without them.
cleanup.desc.schematics = Saved buildings of Litematica, WorldEdit and similar mods.
cleanup.desc.schematicFile = A saved building.
cleanup.desc.loaderCache = A cache written by the mod loader. Rebuilt on the next start.
cleanup.desc.legacyResources = Resources of very old versions, copied here by the launcher. Restored on the next start.
cleanup.desc.userCache = Player names the game has seen. Rebuilt by the game.
cleanup.desc.bookkeeping = The launcher’s record of what it installed here. Deleted, the files stay but are shown as ones the launcher did not install.
cleanup.desc.instanceFolder = A folder created by the game or a mod.
cleanup.desc.instanceFile = A file created by the game or a mod.
cleanup.desc.versions = Installed Minecraft, Fabric, Quilt, Forge and NeoForge versions.
cleanup.desc.version = Version {0}: its manifest and game jar. Deleting a version a profile uses makes the launcher download it again on the next launch.
cleanup.desc.natives = Native libraries unpacked for each version. Unpacked again whenever a version starts.
cleanup.desc.nativesEntry = Native libraries for {0}. Unpacked again when that version starts.
cleanup.desc.libraries = The shared Java library store all versions draw from.
cleanup.desc.libraryGroup = Libraries of {0}. Deleting ones a version needs makes the launcher download them again - Forge and NeoForge may need to be reinstalled.
cleanup.desc.assets = Sounds, textures and translations shared between versions.
cleanup.desc.assetObjects = Every asset file, named by its hash. Deleting all of them makes every version download its assets again - several hundred MB each.
cleanup.desc.asset.indexes = Asset indexes: the list of files each version needs.
cleanup.desc.asset.indexes.entry = The asset list of {0}.
cleanup.desc.asset.virtual = Asset copies laid out for very old versions.
cleanup.desc.asset.virtual.entry = Asset copies for {0}.
cleanup.desc.asset.log_configs = Logging settings of the game.
cleanup.desc.asset.log_configs.entry = Logging settings {0}.
cleanup.desc.assetOther = Other asset data.
cleanup.desc.java = Java runtimes the launcher downloaded. Your own Java installations are not here.
cleanup.desc.javaRuntime = Java {0}, downloaded by the launcher. Profiles that need it will ask to download it again.
cleanup.desc.javaOther = A folder in the Java directory the launcher did not put there itself.
cleanup.desc.cache = Downloads kept to save downloading them again.
cleanup.desc.cacheModpacks = Archives of installed modpacks. The packs are already unpacked.
cleanup.desc.cacheLoaders = Forge and NeoForge installers. Only needed to reinstall.
cleanup.desc.cacheJava = Archives Java was unpacked from.
cleanup.desc.cacheModIcons = Saved logos of mods and packs.
cleanup.desc.cacheVerified = The record of files already checked. Deleted, the next launch checks every file again and takes longer.
cleanup.desc.cacheManifest = The list of Minecraft versions. Deleted, the launcher cannot start offline until it downloads it again.
cleanup.desc.cacheOther = Other cached data. Downloaded again when needed.
cleanup.desc.logs = The launcher’s own logs, attached to bug reports.
cleanup.desc.launcherLog = The log of an earlier launcher session.
cleanup.desc.launcherLogCurrent = The log being written right now.
cleanup.desc.other = Settings, accounts, pictures and the launcher’s own files.
cleanup.desc.icons = Pictures chosen for profiles.
cleanup.desc.iconFile = A profile picture.
cleanup.desc.skins = Skins and capes you chose, and which account wears which.
cleanup.desc.skinFile = A skin or cape you added.
cleanup.desc.skinsIndex = The record of which account wears which skin.
cleanup.desc.settingsFile = The launcher’s settings.
cleanup.desc.accountsFile = Your accounts. Deleted, you would have to sign in again.
cleanup.desc.profilesFile = The list of profiles and groups. Deleted, every profile disappears from the launcher.
cleanup.desc.secrets = Encrypted credentials of your accounts.
cleanup.desc.wrapper = The launch helper that hands the game its session.
cleanup.desc.agents = Left over from an earlier version. Nothing uses it now.
cleanup.desc.unknown = Something the launcher does not recognise. It may belong to another program.
cleanup.confirm.profiles = These profiles will also be removed from the launcher list: {0}
cleanup.done.profiles = Profiles removed from the list: {0}.
update.manual.flatpak = This launcher is installed as a Flatpak, so it does not replace itself: Flatpak does. Download the new .flatpak and open it - your software centre updates the launcher in place, and profiles, worlds and accounts stay. If it came from Flathub, just run the updates there.
update.action.flatpak = Download .flatpak

