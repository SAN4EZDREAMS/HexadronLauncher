settings.curseforge.prompt = Leave empty to switch CurseForge off
settings.signIn = Microsoft sign-in
settings.signIn.browser = In your own browser
settings.signIn.deviceCode = With a code
settings.signIn.note = Your own browser is the way a native application is meant to sign in: you see Microsoft address bar and certificate, and your password manager and two-factor prompts work as they always do. The code method is for a machine with no usable browser.
settings.handshake = Hand the session token over standard input
settings.handshake.note = On by default, and it should stay on. Process arguments can be read by every program on this computer and are copied into crash logs; standard input is not. Switch it off only if a mod loader will not start with it on.
settings.fileStore = Keep credentials in the launcher own encrypted file
settings.fileStore.note = Off by default, and it is a downgrade: the key for that file sits beside it. It is offered because a locked or absent system keyring should be a choice rather than a hang.
settings.dataFolder = Folder
settings.dataFolder.note = Everything the launcher keeps: settings, accounts, profiles, the shared library and asset store, the instance folders, and the instance icons.
settings.logs = Launcher log
settings.logs.note = What the launcher did, one file per run, with the previous five kept beside it. Credentials are removed on the way in, so it is safe to attach to a bug report. The game keeps its own log inside the instance folder; the launcher writes that path down every time it starts one.
