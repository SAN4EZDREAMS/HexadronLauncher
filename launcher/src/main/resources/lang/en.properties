settings.grid.note = The size of the inventory grid. Each instance keeps its own cell, so the grid never changes shape by itself. The same two numbers can be changed from the edges of the grid.
settings.grid.refusedHeader = The grid was not resized
settings.grid.refusedColumns = The columns stayed at {0}: some instances would have had no cell to move to. Add a row first, or move some instances yourself.
settings.grid.refusedRows = The rows stayed at {0}: some instances would have had no cell to move to. Add a column first, or move some instances yourself.
settings.splash = Start-up window, seconds
settings.splash.note = How long the start-up window stays up at minimum. Zero removes the floor. A click or a key always closes it sooner.
settings.keepOpen = Keep the launcher open while the game runs
settings.tray = Hide to the notification area while the game runs
settings.tray.note = The window comes back by itself when the game closes. The notification icon is also where the game can be stopped from.
settings.verify = Check every file before each launch
settings.verify.note = Off by default. The launcher re-reads a file only when its length or its timestamp has changed since it was last checked against its hash, which is what makes a launch take a second instead of a minute. Turn this on to read all of it every time - about five thousand files for a modern version - and to unpack the native libraries again from their jars.

settings.modWarnings = Warn before breaking a mod's dependency
settings.modWarnings.note = The launcher reads what each jar says it needs to start, and asks before you switch off or delete something other mods depend on. Turn this off if you are taking an instance apart and do not want the question every time.
settings.modIconCache = Mod picture cache, MB
settings.modIconCache.note = How much of the data folder the mod logos already fetched may fill. They are kept so that the list draws itself on the second start without a connection; when the folder passes this size, the ones nobody has looked at for longest go first. 32 MB is around two thousand logos. Lowering it sweeps the folder straight away.

