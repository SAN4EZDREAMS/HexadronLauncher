bisect.running = The game is running. Play until the problem appears or you are sure it does not, then close the game.
bisect.question = Did the problem occur?
bisect.yes = Yes, it occurred
bisect.no = No, it works
bisect.crashed = The game crashed. This counts as the problem.
bisect.found.one = The problem is caused by {0}.
bisect.found.pair = The problem occurs when {0} and {1} are both switched on.
bisect.found.with = Together with the mods it needs: {0}
bisect.keepOff = Keep {0} switched off
bisect.restoreAll = Restore all mods
bisect.cancel = Stop and restore
bisect.restored = All mods are switched on as before the search.
bisect.keptOff = {0} stays switched off. The other mods are back as before the search.
