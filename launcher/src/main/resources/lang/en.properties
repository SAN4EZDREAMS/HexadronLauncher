settings.grid.columns = Grid columns
settings.grid.rows = Grid rows
settings.grid.note = The size of the inventory grid. Each instance keeps its own cell, so the grid never changes shape by itself. The same two numbers can be changed from the edges of the grid.
settings.grid.refusedHeader = The grid was not resized
settings.grid.refusedColumns = The columns stayed at {0}: some instances would have had no cell to move to. Add a row first, or move some instances yourself.
settings.grid.refusedRows = The rows stayed at {0}: some instances would have had no cell to move to. Add a column first, or move some instances yourself.
settings.splash = Start-up window, seconds
settings.splash.note = How long the start-up window stays up at minimum. Zero removes the floor. A click or a key always closes it sooner.
settings.keepOpen = Keep the launcher open while the game runs
settings.tray = Hide to the notification area while the game runs
settings.tray.note = The window comes back by itself when the game closes. The notification icon is also where the game can be stopped from.
settings.verify = Check every file before each launch
settings.verify.note = Off by default. The launcher re-reads a file only when its length or its timestamp has changed since it was last checked against its hash, which is what makes a launch take a second instead of a minute. Turn this on to read all of it every time - about five thousand files for a modern version - and to unpack the native libraries again from their jars.
settings.java = When Java is missing
settings.java.ask = Ask each time
settings.java.always = Download it
settings.java.never = Never download it
settings.java.note = A Java runtime is 45 to 90 MB from a host you did not choose, so the launcher asks first. Never means a profile that needs a Java version this computer does not have will say which one to install.
settings.concurrency = Simultaneous downloads
settings.concurrency.note = More is faster on a good connection and worse on a poor one. Twelve suits most connections.
settings.proxy = Route
settings.proxy.system = This computer's settings
settings.proxy.direct = Straight out, no proxy
settings.proxy.manual = A proxy I type in
settings.proxy.note = For a network where Mojang's hosts do not answer - a firewall, an antivirus, a provider blocking them. The files still come from Mojang and are still checked against Mojang's own hashes; only the route changes. HTTP proxies only: Java's HTTP client does not speak SOCKS, so a SOCKS-only address would silently do nothing.
settings.proxy.host = Address
settings.proxy.port = Port
settings.proxy.user = User
settings.proxy.password = Password
settings.proxy.optional = optional
settings.proxy.privacy = Everything the launcher fetches is HTTPS, which an HTTP proxy carries as a tunnel it cannot read. The proxy learns which hosts are contacted and nothing else - no account token, no password, no file contents. The password here is stored the way account tokens are, not in the settings file, and it is not shown again once saved.
settings.proxy.test = Test the connection
settings.proxy.testing = Testing...
settings.proxy.ok = Mojang answered. This route works.
settings.proxy.failed = No answer: {0}
settings.proxy.incomplete = A proxy needs an address and a port. The route was left as it was.
settings.proxy.notsaved = The proxy password could not be saved to this computer's credential store.
settings.curseforge = CurseForge API key
settings.curseforge.prompt = Leave empty to switch CurseForge off
settings.signIn = Microsoft sign-in
settings.signIn.browser = In your own browser
settings.signIn.deviceCode = With a code
settings.signIn.note = Your own browser is the way a native application is meant to sign in: you see Microsoft address bar and certificate, and your password manager and two-factor prompts work as they always do. The code method is for a machine with no usable browser.
settings.handshake = Hand the session token over standard input
settings.handshake.note = On by default, and it should stay on. Process arguments can be read by every program on this computer and are copied into crash logs; standard input is not. Switch it off only if a mod loader will not start with it on.
settings.fileStore = Keep credentials in the launcher own encrypted file
settings.fileStore.note = Off by default, and it is a downgrade: the key for that file sits beside it. It is offered because a locked or absent system keyring should be a choice rather than a hang.
settings.dataFolder = Folder
settings.dataFolder.note = Everything the launcher keeps: settings, accounts, profiles, the shared library and asset store, the instance folders, and the instance icons.
settings.logs = Launcher log
settings.logs.note = What the launcher did, one file per run, with the previous five kept beside it. Credentials are removed on the way in, so it is safe to attach to a bug report. The game keeps its own log inside the instance folder; the launcher writes that path down every time it starts one.
log.gameLog = The game writes its own log to {0}

