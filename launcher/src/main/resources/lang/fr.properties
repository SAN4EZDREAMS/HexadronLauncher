settings.signIn.deviceCode = Avec un code
settings.signIn.note = Votre propre navigateur est la manière prévue pour qu'une application native se connecte : vous voyez la barre d'adresse et le certificat de Microsoft, et votre gestionnaire de mots de passe et vos demandes de double authentification fonctionnent comme d'habitude. La méthode par code est destinée à une machine sans navigateur utilisable.
settings.handshake = Transmettre le jeton de session par l'entrée standard
settings.handshake.note = Activé par défaut, et cela doit le rester. Les arguments de processus peuvent être lus par tous les programmes de cet ordinateur et sont copiés dans les rapports de plantage ; l'entrée standard, non. Désactivez cette option uniquement si un chargeur de mods refuse de démarrer quand elle est activée.
settings.fileStore = Conserver les identifiants dans le fichier chiffré propre au launcher
settings.fileStore.note = Désactivé par défaut, et c'est une solution moins sûre : la clé de ce fichier se trouve juste à côté. Cette option existe parce qu'un trousseau système verrouillé ou absent doit être un choix plutôt qu'un blocage.
settings.dataFolder = Dossier
settings.dataFolder.note = Tout ce que le launcher conserve : paramètres, comptes, profils, bibliothèques et ressources partagées, dossiers des instances et icônes des instances.
settings.logs = Journal du launcher
settings.logs.note = Ce que le launcher a fait, un fichier par exécution, les cinq précédents étant conservés à côté. Les identifiants sont retirés à l'écriture : vous pouvez donc le joindre sans risque à un rapport de bug. Le jeu tient son propre journal dans le dossier de l'instance ; le launcher note ce chemin à chaque lancement.
