settings.proxy.privacy = Tout ce que le launcher télécharge passe par HTTPS, qu'un proxy HTTP transporte dans un tunnel qu'il ne peut pas lire. Le proxy apprend quels hôtes sont contactés et rien d'autre - aucun jeton de compte, aucun mot de passe, aucun contenu de fichier. Le mot de passe saisi ici est stocké comme les jetons de compte, pas dans le fichier de paramètres, et il n'est plus affiché une fois enregistré.
