mods.curseforge.key.body = Collez une clé Core API obtenue dans la console CurseForge for Studios. Elle est conservée dans launcher.json sur cet ordinateur et n'est envoyée qu'à CurseForge. Un champ vide désactive CurseForge.
settings.curseforge.console = Ouvrir console.curseforge.com
settings.curseforge.howto = Comment en obtenir une : ouvrez console.curseforge.com, connectez-vous ou inscrivez-vous, puis allez dans API Keys - donnez n'importe quel nom à la clé et copiez la chaîne affichée. Elle commence par $2a$ et fait environ soixante caractères. N'utilisez PAS la page API tokens de legacy.curseforge.com : elle délivre un jeton d'envoi de 32 caractères destiné aux auteurs de projets, et api.curseforge.com le refuse avec une erreur HTTP 403 à chaque requête.
mods.curseforge.key.wrongKind = Cela ressemble à un jeton Upload API : 32 caractères hexadécimaux, provenant de legacy.curseforge.com/account/api-tokens. Ce jeton sert à envoyer des fichiers vers les projets dont vous êtes propriétaire - api.curseforge.com est un service différent et le refuse avec une erreur HTTP 403 à chaque requête.\n\nCe dont un launcher a besoin, c'est d'une clé Core API de console.curseforge.com. Connectez-vous sur ce site, ouvrez API Keys, nommez une clé et copiez la chaîne affichée : elle commence par $2a$ et fait environ soixante caractères.
