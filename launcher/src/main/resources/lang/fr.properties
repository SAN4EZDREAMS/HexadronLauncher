settings.verify = Vérifier chaque fichier avant chaque lancement
settings.verify.note = Désactivé par défaut. Le launcher ne relit un fichier que si sa taille ou sa date a changé depuis sa dernière vérification par rapport à son hash ; c'est ce qui permet à un lancement de prendre une seconde au lieu d'une minute. Activez cette option pour tout relire à chaque fois - environ cinq mille fichiers pour une version récente - et pour extraire à nouveau les bibliothèques natives de leurs jars.

settings.modWarnings = Avertir avant de casser une dépendance de mod
settings.modWarnings.note = Le launcher lit ce que chaque jar déclare nécessaire à son démarrage, et demande confirmation avant que vous ne désactiviez ou supprimiez quelque chose dont d'autres mods dépendent. Désactivez cette option si vous démontez une instance et ne voulez pas la question à chaque fois.
settings.modIconCache = Cache des images de mods, Mo
settings.modIconCache.note = La place que les logos de mods déjà téléchargés peuvent occuper dans le dossier de données. Ils sont conservés pour que la liste s'affiche au deuxième démarrage sans connexion ; quand le dossier dépasse cette taille, ceux qui n'ont pas été consultés depuis le plus longtemps partent en premier. 32 Mo représentent environ deux mille logos. Réduire cette valeur nettoie le dossier immédiatement.

