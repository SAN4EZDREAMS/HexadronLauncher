settings.proxy.note = Pour un réseau où les serveurs de Mojang ne répondent pas - un pare-feu, un antivirus, un fournisseur d'accès qui les bloque. Les fichiers viennent toujours de Mojang et sont toujours vérifiés avec les hashs de Mojang ; seul l'itinéraire change. Proxys HTTP uniquement : le client HTTP de Java ne gère pas SOCKS, une adresse uniquement SOCKS ne ferait donc rien, sans le signaler.
