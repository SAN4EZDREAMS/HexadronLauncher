modpacks.target.warning = Un modpack est un Minecraft prêt à l'emploi et préconfiguré. Posé sur un profil sur lequel vous jouez déjà, sa version, son chargeur et ses mods prennent la place de ce qui s'y trouve : les mods que vous avez installés vous-même cesseront très probablement de fonctionner, et le jeu risque de ne pas démarrer du tout. Installer dans un nouveau profil est la solution sûre, et celle qui est recommandée.
