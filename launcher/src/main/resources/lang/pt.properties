ms.notConfigured.header = O login da Microsoft não está configurado
ms.notConfigured.body = O login da Microsoft precisa de um ID de aplicativo (cliente) do Azure que a Mojang tenha aprovado para autenticação do Minecraft.\n\nRegistre um aplicativo no portal do Azure, peça a aprovação da Mojang e depois coloque o ID do cliente em launcher.json como "microsoftClientId".
