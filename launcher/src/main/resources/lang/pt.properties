mods.curseforge.key.header = Chave de API do CurseForge
mods.curseforge.key.body = Cole uma chave da Core API do console do CurseForge for Studios. Ela fica guardada em launcher.json neste computador e é enviada somente ao CurseForge. Um campo vazio desliga o CurseForge.
settings.curseforge.console = Abrir console.curseforge.com
settings.curseforge.howto = Como obter uma: abra console.curseforge.com, entre ou crie uma conta e vá em API Keys - dê qualquer nome à chave e copie o texto que aparece. Ele começa com $2a$ e tem cerca de sessenta caracteres. NÃO use a página API tokens em legacy.curseforge.com: ela gera um token de upload de 32 caracteres para autores de projetos, e api.curseforge.com o recusa com HTTP 403 em todas as requisições.
mods.curseforge.key.wrongKind = Isso parece um token da Upload API: 32 caracteres hexadecimais, de legacy.curseforge.com/account/api-tokens. Esse token envia arquivos para projetos seus - api.curseforge.com é outro serviço e o recusa com HTTP 403 em todas as requisições.\n\nO que um launcher precisa é de uma chave da Core API de console.curseforge.com. Entre lá, abra API Keys, dê um nome a uma chave e copie o texto que aparece: ele começa com $2a$ e tem cerca de sessenta caracteres.
