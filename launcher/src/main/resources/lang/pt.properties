auth.problem.noUsername.purchased = Esta conta tem Minecraft: Java Edition, mas ainda não foi escolhido um nome de jogador.\n\nAbra o Minecraft Launcher oficial, entre com esta conta e crie um nome de jogador. Depois entre aqui novamente.
auth.problem.noUsername.gamePass = Esta conta tem Minecraft pelo Game Pass, mas ainda não tem perfil do Java Edition.\n\n1. Verifique se a assinatura do Game Pass está ativa e paga: {1}\n2. Abra o Minecraft: Java Edition uma vez pelo Minecraft Launcher oficial para criar um nome de jogador.\n\nDepois entre aqui novamente.
auth.problem.otherGamesOnly = Esta conta Microsoft tem outros jogos Minecraft (por exemplo, Bedrock Edition), mas não tem Java Edition nem Game Pass ativo.\n\n• Se você jogava pelo Game Pass: a assinatura expirou ou não foi paga. Renove-a: {1}\n• Se você comprou o Java Edition: ele está em outra conta Microsoft. Entre novamente e escolha essa conta.
auth.problem.noLicence = Esta conta Microsoft não tem Minecraft: Java Edition: o jogo não foi comprado nela e não há Game Pass ativo.\n\n• Se você jogava pelo Game Pass: a assinatura expirou ou não foi paga. Renove-a: {1}\n• Se você comprou o Java Edition: ele está em outra conta Microsoft. Entre novamente e escolha essa conta.
auth.problem.licenceEnded = O nome de jogador "{0}" existe, mas esta conta não tem mais licença do Java Edition: o jogo não foi comprado nela e não há Game Pass ativo.\n\nSe você jogava pelo Game Pass: a assinatura expirou ou não foi paga. Renove-a em {1} e entre novamente.
