settings.verify = हर लॉन्च से पहले हर फ़ाइल की जाँच करें
settings.verify.note = डिफ़ॉल्ट रूप से बंद। लॉन्चर किसी फ़ाइल को तभी दोबारा पढ़ता है जब उसके हैश से पिछली जाँच के बाद उसकी लंबाई या टाइमस्टैम्प बदल गया हो, इसी वजह से लॉन्च में एक मिनट की बजाय एक सेकंड लगता है। हर बार सब कुछ पढ़ने के लिए - आधुनिक संस्करण के लिए लगभग पाँच हज़ार फ़ाइलें - और नेटिव लाइब्रेरी को उनकी jar फ़ाइलों से फिर से अनपैक करने के लिए इसे चालू करें।

settings.modWarnings = किसी मॉड की निर्भरता तोड़ने से पहले चेतावनी दें
settings.modWarnings.note = लॉन्चर पढ़ता है कि हर jar को शुरू होने के लिए क्या चाहिए, और किसी ऐसी चीज़ को बंद करने या मिटाने से पहले पूछता है जिस पर दूसरे मॉड निर्भर हैं। अगर आप किसी इंस्टेंस को अलग-अलग कर रहे हैं और हर बार यह सवाल नहीं चाहते, तो इसे बंद कर दें।
settings.modIconCache = मॉड तस्वीरों का कैश, MB
settings.modIconCache.note = पहले से डाउनलोड किए गए मॉड लोगो डेटा फ़ोल्डर में कितनी जगह ले सकते हैं। इन्हें इसलिए रखा जाता है ताकि दूसरी बार शुरू करने पर सूची बिना कनेक्शन के भी दिख सके; जब फ़ोल्डर इस आकार से बड़ा हो जाता है, तो जिन्हें सबसे लंबे समय से किसी ने नहीं देखा वे पहले हटते हैं। 32 MB लगभग दो हज़ार लोगो के बराबर है। इसे घटाने पर फ़ोल्डर तुरंत साफ़ हो जाता है।

