cleanup.desc.dataRoot = लॉन्चर का डेटा फ़ोल्डर।
cleanup.desc.instances = इंस्टेंस फ़ोल्डर: हर प्रोफ़ाइल के लिए एक, उसकी दुनियाओं, मॉड, रिसोर्स पैक, शेडर और सेटिंग्स के साथ। यह आपका गेम डेटा है।
cleanup.desc.profile = प्रोफ़ाइल "{0}" का गेम फ़ोल्डर: इसकी दुनियाएँ, मॉड, पैक और सेटिंग्स। पूरा टिक करने पर, प्रोफ़ाइल अपनी सभी फ़ाइलों के साथ लॉन्चर से हटा दी जाती है, ठीक "हटाएँ" बटन की तरह। प्रोफ़ाइल रखने के लिए केवल इसके अंदर की चीज़ें टिक करें।
cleanup.desc.orphanInstance = एक इंस्टेंस फ़ोल्डर जिसकी ओर कोई प्रोफ़ाइल संकेत नहीं करती - अक्सर "फ़ाइलें रखें" के साथ हटाई गई प्रोफ़ाइल। इसमें अभी भी रखने लायक दुनियाएँ और मॉड हो सकते हैं।
cleanup.desc.deleting = मिटाई गई प्रोफ़ाइलों की फ़ाइलें जिन्हें लॉन्चर ने पूरी तरह नहीं हटाया है। मिटाना सुरक्षित है।
cleanup.desc.saves = सहेजी गई दुनियाएँ। इसे मिटाने से इंस्टेंस की हर दुनिया मिट जाती है।
cleanup.desc.world = एक सहेजी गई दुनिया: भूभाग, इन्वेंटरी, प्रगति। मिटाने पर यह हमेशा के लिए चली जाती है।
cleanup.desc.mods = इंस्टेंस के मॉड। कैटलॉग से इंस्टॉल किए गए मॉड फिर से इंस्टॉल किए जा सकते हैं; आपकी अपनी jar फ़ाइलें नहीं।
cleanup.desc.modFile = एक मॉड। अगर दूसरे मॉड इस पर निर्भर हैं, तो इसके बिना इंस्टेंस शायद शुरू न हो।
cleanup.desc.removedBin = आपके द्वारा हटाए गए मॉड, जो यहाँ रखे गए हैं क्योंकि रीसायकल बिन उपलब्ध नहीं था।
cleanup.desc.config = मॉड सेटिंग्स। मिटाने से हर मॉड अपनी डिफ़ॉल्ट सेटिंग्स पर लौट जाता है।
cleanup.desc.defaultconfigs = डिफ़ॉल्ट सेटिंग्स जो कोई मॉडपैक नई दुनियाओं को देता है।
cleanup.desc.configEntry = एक मॉड की सेटिंग्स। मिटाने पर मॉड अपनी डिफ़ॉल्ट सेटिंग्स के साथ शुरू होता है।
cleanup.desc.resourcepacks = रिसोर्स पैक: टेक्सचर, ध्वनियाँ और मॉडल।
cleanup.desc.shaderpacks = Iris, OptiFine या Canvas के लिए शेडर पैक।
cleanup.desc.packFile = एक रिसोर्स पैक या शेडर पैक।
cleanup.desc.screenshots = गेम में लिए गए स्क्रीनशॉट (F2)।
cleanup.desc.screenshot = एक स्क्रीनशॉट।
cleanup.desc.gameLogs = गेम लॉग। कुछ क्रैश होने पर उपयोगी, वरना मिटाना सुरक्षित है।
cleanup.desc.gameLogFile = एक गेम लॉग।
cleanup.desc.crashReports = गेम द्वारा लिखी गई क्रैश रिपोर्ट।
cleanup.desc.crashReport = एक क्रैश रिपोर्ट। केवल यह पता लगाने के लिए ज़रूरी है कि गेम क्रैश क्यों हुआ।
cleanup.desc.options = गेम सेटिंग्स: नियंत्रण, वीडियो, ध्वनि, चालू रिसोर्स पैक। मिटाने पर गेम अपनी डिफ़ॉल्ट सेटिंग्स के साथ शुरू होता है।
cleanup.desc.servers = मल्टीप्लेयर स्क्रीन की सर्वर सूची।
cleanup.desc.scripts = किसी मॉडपैक की स्क्रिप्ट (KubeJS, CraftTweaker)। इनके बिना पैक शायद काम न करे।
cleanup.desc.schematics = Litematica, WorldEdit और ऐसे ही मॉड की सहेजी गई इमारतें।
cleanup.desc.schematicFile = एक सहेजी गई इमारत।
cleanup.desc.loaderCache = मॉड लोडर द्वारा लिखा गया कैश। अगली बार शुरू होने पर फिर से बनता है।
cleanup.desc.legacyResources = बहुत पुराने संस्करणों के रिसोर्स, जिन्हें लॉन्चर ने यहाँ कॉपी किया है। अगली बार शुरू होने पर वापस आ जाते हैं।
cleanup.desc.userCache = गेम द्वारा देखे गए खिलाड़ियों के नाम। गेम इसे फिर से बनाता है।
cleanup.desc.bookkeeping = लॉन्चर का रिकॉर्ड कि उसने यहाँ क्या इंस्टॉल किया। मिटाने पर फ़ाइलें बनी रहती हैं, लेकिन ऐसी फ़ाइलों के रूप में दिखती हैं जिन्हें लॉन्चर ने इंस्टॉल नहीं किया।
cleanup.desc.instanceFolder = गेम या किसी मॉड द्वारा बनाया गया फ़ोल्डर।
cleanup.desc.instanceFile = गेम या किसी मॉड द्वारा बनाई गई फ़ाइल।
cleanup.desc.versions = इंस्टॉल किए गए Minecraft, Fabric, Quilt, Forge और NeoForge संस्करण।
cleanup.desc.version = संस्करण {0}: इसका मैनिफ़ेस्ट और गेम jar। किसी प्रोफ़ाइल द्वारा उपयोग किए जाने वाले संस्करण को मिटाने पर लॉन्चर अगले लॉन्च पर उसे फिर से डाउनलोड करता है।
cleanup.desc.natives = हर संस्करण के लिए अनपैक की गई नेटिव लाइब्रेरी। जब भी कोई संस्करण शुरू होता है, फिर से अनपैक हो जाती हैं।
cleanup.desc.nativesEntry = {0} के लिए नेटिव लाइब्रेरी। वह संस्करण शुरू होने पर फिर से अनपैक हो जाती हैं।
cleanup.desc.libraries = साझा Java लाइब्रेरी स्टोर जिससे सभी संस्करण लेते हैं।
cleanup.desc.libraryGroup = {0} की लाइब्रेरी। किसी संस्करण के लिए ज़रूरी लाइब्रेरी मिटाने पर लॉन्चर उन्हें फिर से डाउनलोड करता है - Forge और NeoForge को फिर से इंस्टॉल करना पड़ सकता है।
cleanup.desc.assets = संस्करणों के बीच साझा ध्वनियाँ, टेक्सचर और अनुवाद।
cleanup.desc.assetObjects = हर एसेट फ़ाइल, उसके हैश के नाम से। इन सभी को मिटाने पर हर संस्करण अपने एसेट फिर से डाउनलोड करता है - हर एक के लिए कई सौ MB।
cleanup.desc.asset.indexes = एसेट इंडेक्स: हर संस्करण के लिए ज़रूरी फ़ाइलों की सूची।
cleanup.desc.asset.indexes.entry = {0} की एसेट सूची।
cleanup.desc.asset.virtual = बहुत पुराने संस्करणों के लिए रखी गई एसेट की कॉपियाँ।
cleanup.desc.asset.virtual.entry = {0} के लिए एसेट की कॉपियाँ।
cleanup.desc.asset.log_configs = गेम की लॉगिंग सेटिंग्स।
cleanup.desc.asset.log_configs.entry = लॉगिंग सेटिंग्स {0}।
cleanup.desc.assetOther = अन्य एसेट डेटा।
cleanup.desc.java = लॉन्चर द्वारा डाउनलोड किए गए Java रनटाइम। आपके अपने Java इंस्टॉलेशन यहाँ नहीं हैं।
cleanup.desc.javaRuntime = Java {0}, लॉन्चर द्वारा डाउनलोड किया गया। जिन प्रोफ़ाइलों को इसकी ज़रूरत है, वे इसे फिर से डाउनलोड करने के लिए पूछेंगी।
cleanup.desc.javaOther = Java डायरेक्टरी में एक फ़ोल्डर जिसे लॉन्चर ने खुद वहाँ नहीं रखा।
cleanup.desc.cache = फिर से डाउनलोड करने से बचने के लिए रखे गए डाउनलोड।
cleanup.desc.cacheModpacks = इंस्टॉल किए गए मॉडपैक के आर्काइव। पैक पहले ही अनपैक हो चुके हैं।
cleanup.desc.cacheLoaders = Forge और NeoForge इंस्टॉलर। केवल फिर से इंस्टॉल करने के लिए ज़रूरी।
cleanup.desc.cacheJava = वे आर्काइव जिनसे Java अनपैक किया गया था।
cleanup.desc.cacheModIcons = मॉड और पैक के सहेजे गए लोगो।
cleanup.desc.cacheVerified = पहले से जाँची गई फ़ाइलों का रिकॉर्ड। मिटाने पर अगला लॉन्च हर फ़ाइल की फिर से जाँच करता है और ज़्यादा समय लेता है।
cleanup.desc.cacheManifest = Minecraft संस्करणों की सूची। मिटाने पर लॉन्चर तब तक ऑफ़लाइन शुरू नहीं हो सकता जब तक वह इसे फिर से डाउनलोड न कर ले।
cleanup.desc.cacheOther = अन्य कैश डेटा। ज़रूरत पड़ने पर फिर से डाउनलोड होता है।
cleanup.desc.logs = लॉन्चर के अपने लॉग, जो बग रिपोर्ट के साथ जोड़े जाते हैं।
cleanup.desc.launcherLog = पिछले लॉन्चर सेशन का लॉग।
cleanup.desc.launcherLogCurrent = वह लॉग जो अभी लिखा जा रहा है।
cleanup.desc.other = सेटिंग्स, खाते, तस्वीरें और लॉन्चर की अपनी फ़ाइलें।
cleanup.desc.icons = प्रोफ़ाइलों के लिए चुनी गई तस्वीरें।
cleanup.desc.iconFile = एक प्रोफ़ाइल तस्वीर।
cleanup.desc.skins = आपके द्वारा चुनी गई स्किन और केप, और कौन सा खाता कौन सी पहनता है।
cleanup.desc.skinFile = आपके द्वारा जोड़ी गई एक स्किन या केप।
cleanup.desc.skinsIndex = इसका रिकॉर्ड कि कौन सा खाता कौन सी स्किन पहनता है।
cleanup.desc.settingsFile = लॉन्चर की सेटिंग्स।
cleanup.desc.accountsFile = आपके खाते। मिटाने पर आपको फिर से साइन इन करना होगा।
cleanup.desc.profilesFile = प्रोफ़ाइलों और समूहों की सूची। मिटाने पर हर प्रोफ़ाइल लॉन्चर से गायब हो जाती है।
cleanup.desc.secrets = आपके खातों के एन्क्रिप्टेड क्रेडेंशियल।
cleanup.desc.wrapper = लॉन्च सहायक जो गेम को उसका सेशन देता है।
cleanup.desc.agents = गेम से जुड़ा स्किन एजेंट।
cleanup.desc.unknown = कुछ ऐसा जिसे लॉन्चर नहीं पहचानता। यह किसी दूसरे प्रोग्राम का हो सकता है।
cleanup.confirm.profiles = ये प्रोफ़ाइलें भी लॉन्चर की सूची से हटा दी जाएँगी: {0}
cleanup.done.profiles = सूची से हटाई गई प्रोफ़ाइलें: {0}।
update.manual.flatpak = यह लॉन्चर Flatpak के रूप में इंस्टॉल है, इसलिए यह खुद को नहीं बदलता: यह काम Flatpak करता है। नई .flatpak फ़ाइल डाउनलोड करें और उसे खोलें - आपका सॉफ़्टवेयर सेंटर लॉन्चर को उसी जगह अपडेट कर देता है, और प्रोफ़ाइलें, दुनियाएँ और खाते बने रहते हैं। अगर यह Flathub से आया है, तो बस वहाँ अपडेट चलाएँ।
update.action.flatpak = .flatpak डाउनलोड करें
