settings.splash = Startfenster, Sekunden
settings.splash.note = Wie lange das Startfenster mindestens stehen bleibt. Null hebt die Untergrenze auf. Ein Klick oder eine Taste schließt es immer früher.
settings.keepOpen = Launcher während des Spiels offen lassen
settings.tray = Während des Spiels in den Infobereich ausblenden
settings.tray.note = Das Fenster kommt von selbst zurück, wenn das Spiel endet. Über das Symbol im Infobereich lässt sich das Spiel auch beenden.
settings.verify = Vor jedem Start alle Dateien prüfen
settings.verify.note = Standardmäßig aus. Der Launcher liest eine Datei nur dann erneut, wenn ihre Länge oder ihr Zeitstempel sich seit der letzten Prüfung gegen ihren Hash geändert hat - deshalb dauert ein Start eine Sekunde statt einer Minute. Einschalten, um jedes Mal alles zu lesen - bei einer aktuellen Version rund fünftausend Dateien - und die nativen Bibliotheken erneut aus ihren Jars zu entpacken.

settings.modWarnings = Warnen, bevor eine Abhängigkeit zerbricht
settings.modWarnings.note = Der Launcher liest, was jede Jar-Datei zum Starten braucht, und fragt nach, bevor etwas ausgeschaltet oder gelöscht wird, von dem andere Mods abhängen. Ausschalten, wenn eine Instanz absichtlich auseinandergenommen wird.
settings.java = Wenn Java fehlt
settings.java.ask = Jedes Mal fragen
settings.java.always = Herunterladen
settings.java.never = Nie herunterladen
settings.java.note = Eine Java-Laufzeit sind 45 bis 90 MB von einem Server, den Sie nicht gewählt haben, deshalb fragt der Launcher zuerst. Nie bedeutet, dass eine Instanz mit einer fehlenden Java-Version nur noch sagt, was zu installieren ist.
settings.concurrency = Gleichzeitige Downloads
settings.concurrency.note = Mehr ist auf einer guten Leitung schneller und auf einer schlechten schlechter. Zwölf passt für die meisten Verbindungen.
settings.proxy = Route
settings.proxy.system = Einstellungen dieses Rechners
settings.proxy.direct = Direkt, ohne Proxy
settings.proxy.manual = Ein Proxy, den ich eingebe
settings.proxy.note = Fuer ein Netz, in dem Mojangs Hosts nicht antworten - eine Firewall, ein Virenscanner, ein Provider, der sie sperrt. Die Dateien kommen weiterhin von Mojang und werden weiterhin gegen Mojangs eigene Hashes geprueft; nur die Route aendert sich. Nur HTTP-Proxys: Javas HTTP-Client spricht kein SOCKS, eine reine SOCKS-Adresse wuerde also stillschweigend nichts tun.
settings.proxy.host = Adresse
settings.proxy.port = Port
settings.proxy.user = Benutzer
settings.proxy.password = Passwort
settings.proxy.optional = optional
settings.proxy.privacy = Alles, was der Launcher holt, laeuft ueber HTTPS, das ein HTTP-Proxy als Tunnel weiterreicht, den er nicht lesen kann. Der Proxy erfaehrt nur, welche Hosts kontaktiert werden - kein Konto-Token, kein Passwort, keine Dateiinhalte. Das Passwort hier wird wie die Konto-Token gespeichert, nicht in der Einstellungsdatei, und nach dem Speichern nicht mehr angezeigt.
settings.proxy.test = Verbindung testen
settings.proxy.testing = Test laeuft...
settings.proxy.ok = Mojang hat geantwortet. Diese Route funktioniert.
settings.proxy.failed = Keine Antwort: {0}
settings.proxy.incomplete = Ein Proxy braucht Adresse und Port. Die Route blieb unveraendert.
settings.proxy.notsaved = Das Proxy-Passwort konnte nicht im Anmeldedatenspeicher dieses Rechners abgelegt werden.
settings.curseforge = CurseForge-API-Schlüssel
settings.curseforge.prompt = Leer schaltet CurseForge ab
settings.signIn = Microsoft-Anmeldung
settings.signIn.browser = Im eigenen Browser
settings.signIn.deviceCode = Mit einem Code
settings.signIn.note = Der eigene Browser ist der vorgesehene Weg für eine native Anwendung: Sie sehen Adresszeile und Zertifikat von Microsoft, und Passwortmanager sowie Zwei-Faktor-Abfragen funktionieren wie immer. Der Code ist für einen Rechner ohne brauchbaren Browser.
settings.handshake = Sitzungstoken über die Standardeingabe übergeben
settings.handshake.note = Standardmäßig an, und das soll so bleiben. Prozessargumente kann jedes Programm auf diesem Rechner lesen und sie landen in Absturzprotokollen; die Standardeingabe nicht. Nur abschalten, wenn ein Mod-Loader damit nicht startet.
settings.fileStore = Zugangsdaten in der eigenen verschlüsselten Datei des Launchers halten
settings.fileStore.note = Standardmäßig aus, und es ist eine Verschlechterung: der Schlüssel zu dieser Datei liegt daneben. Die Option gibt es, weil ein gesperrter oder fehlender Systemschlüsselbund eine Wahl sein sollte und kein Hängenbleiben.
settings.dataFolder = Ordner
settings.dataFolder.note = Alles, was der Launcher behält: Einstellungen, Konten, Profile, den gemeinsamen Bibliotheks- und Asset-Speicher, die Instanzordner und die Instanzsymbole.
settings.logs = Launcher-Protokoll
settings.logs.note = Was der Launcher getan hat, eine Datei pro Start, die letzten fuenf daneben. Anmeldedaten werden beim Schreiben entfernt, die Datei laesst sich also gefahrlos an einen Fehlerbericht haengen. Das Spiel fuehrt sein eigenes Protokoll im Instanzordner; der Launcher notiert diesen Pfad bei jedem Start.
log.gameLog = Das Spiel schreibt sein eigenes Protokoll nach {0}

