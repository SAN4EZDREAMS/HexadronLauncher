packs.shader.remove.body = Usunąć "{0}" z tej instancji?\n\nPlik zostanie usunięty z folderu shaderpacks. Światy pozostają nietknięte.
packs.resourcepack.remove.body.external = Usunąć "{0}" z tej instancji?\n\n{1} nie zostało zainstalowane przez launcher, więc trafi do kosza, a nie zostanie zniszczone - launcher nie pobierze go ponownie.
packs.shader.remove.body.external = Usunąć "{0}" z tej instancji?\n\n{1} nie zostało zainstalowane przez launcher, więc trafi do kosza, a nie zostanie zniszczone - launcher nie pobierze go ponownie.
