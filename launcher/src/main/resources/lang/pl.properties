settings.modIconCache.note = Ile miejsca w folderze danych moga zajmowac juz pobrane ikony modow. Sa przechowywane, aby przy drugim uruchomieniu lista rysowala sie bez polaczenia; gdy folder przekroczy ten rozmiar, pierwsze znikaja te, na ktore najdluzej nikt nie patrzyl. 32 MB to okolo dwoch tysiecy ikon. Po zmniejszeniu folder jest porzadkowany od razu.

