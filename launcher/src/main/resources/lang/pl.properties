datapacks.note = Minecraft wczytuje datapaki osobno dla każdego świata, więc trafią do świata wybranego powyżej. Wczytuje je czysty Minecraft: loader modów nie jest potrzebny.
datapacks.withoutMods = Instaluj datapaki bez modów
datapacks.withoutMods.tip = Niektóre datapaki potrzebują moda, aby działać - loadera pakietów globalnych albo biblioteki - i taki mod trafia do folderu modów tej instancji, oznaczony jako należący do paka. Zaznacz, aby zainstalować sam pak: nadal trafi do świata, a to, o co prosił, zostanie pominięte.
datapacks.withoutMods.vanilla = Ta instancja nie ma loadera modów, więc żadnego moda nie da się tu zainstalować. Datapaki nadal się instalują: wczytuje je czysty Minecraft.
datapacks.noWorlds = Ta instancja nie ma jeszcze światów. Uruchom ją raz albo utwórz świat - lista się wypełni.
datapacks.pickWorld = Najpierw wybierz świat.
datapacks.tab.installed = W tym świecie ({0})
datapacks.installed.empty = Ten świat nie ma datapaków. Znajdź je w katalogu albo zaimportuj zip.
datapacks.installed.search = Szukaj datapaków w tym świecie
datapacks.installed = Zainstalowano {0} pak(ów) w {1}
datapacks.installed.withMods = Zainstalowano {0} pak(ów) w świecie {1} oraz {2} mod(ów), których pak potrzebuje
datapacks.imported = Zaimportowano {0} pak(ów) do {1}
datapacks.import.title = Wybierz pliki zip datapaków
datapacks.import.filter = Datapaki (.zip)
datapacks.import.skipped.notZip = {0} - to nie zip
datapacks.import.skipped.already = {0} - już jest w tym świecie
datapacks.import.skipped.notPack = {0} - nie ma w nim pack.mcmeta, więc Minecraft też go odrzuci
datapacks.remove.header = Usuń datapak
datapacks.remove.body = Usunąć "{0}" ze świata "{1}"?\n\nZip zostanie usunięty. Sam świat zostaje, ale wszystko, co pak do niego dodał, przestanie działać.
datapacks.remove.body.external = Usunąć "{0}" z tego świata?\n\n{1} nie został zainstalowany przez launcher, więc trafi do kosza, a nie zostanie usunięty - launcher nie pobierze go ponownie.
datapacks.disabled = {0} jest wyłączony - gra go nie wczyta
datapacks.removed.withMods = Usunięto {0} oraz {1} mod(ów), których potrzebował
datapacks.folder.noToggle = Ten pak to folder, nie zip. Zmiana nazwy folderu nie ukrywa go przed grą, więc można go tylko usunąć.
# ---------------------------------------------------------------- paczki
#
# Paczki zasobów i shadery: dwa rodzaje, które mieszkają we własnym folderze
# instancji i nie są ładowane przez loader modów.
mods.kind.resourcepack = Paczki zasobów
mods.kind.shader = Shadery
mods.search.prompt.resourcepack = Szukaj paczek zasobów do tej wersji
mods.search.prompt.shader = Szukaj paczek shaderów
packs.resourcepack.note = Trafiają do folderu resourcepacks tej instancji. Ładuje je samo Minecraft, więc loader modów nie jest potrzebny - to, które są włączone, wybiera się w grze, w Opcjach, Paczki zasobów.
packs.shader.note = Trafiają do folderu shaderpacks tej instancji. Minecraft sam ich nie ładuje: robi to Iris, OptiFine albo Canvas, a używaną paczkę wybiera się w ustawieniach tego moda.
packs.resourcepack.installed.empty = Nie ma tu jeszcze paczek zasobów. Znajdź coś w Katalogu albo zaimportuj zip.
packs.shader.installed.empty = Nie ma tu jeszcze paczek shaderów. Znajdź coś w Katalogu albo zaimportuj zip.
