settings.splash = Okno startowe, sekundy
settings.splash.note = Jak długo okno startowe stoi co najmniej. Zero znosi ten dolny limit. Kliknięcie lub klawisz zawsze zamyka je wcześniej.
settings.keepOpen = Trzymaj launcher otwarty w czasie gry
settings.tray = Ukryj do obszaru powiadomień w czasie gry
settings.tray.note = Okno wraca samo, gdy gra się zamknie. Przez ikonę w obszarze powiadomień można też zatrzymać grę.
settings.verify = Sprawdzaj wszystkie pliki przed każdym uruchomieniem
settings.verify.note = Domyślnie wyłączone. Launcher czyta plik ponownie tylko wtedy, gdy jego długość lub czas modyfikacji zmieniły się od ostatniego sprawdzenia z sumą kontrolną - dlatego uruchomienie trwa sekundę, a nie minutę. Włącz, aby za każdym razem czytać wszystko - około pięciu tysięcy plików dla nowej wersji - i ponownie rozpakowywać biblioteki natywne z ich jarów.
settings.java = Gdy brakuje Javy
settings.java.ask = Pytaj za każdym razem
settings.java.always = Pobieraj
settings.java.never = Nigdy nie pobieraj
settings.java.note = Środowisko Javy to 45 do 90 MB z serwera, którego nie wybrałeś, dlatego launcher najpierw pyta. Nigdy oznacza, że instancja wymagająca brakującej wersji Javy tylko powie, co zainstalować.
settings.concurrency = Równoległe pobierania
settings.concurrency.note = Więcej jest szybsze na dobrym łączu i gorsze na słabym. Dwanaście pasuje do większości połączeń.
settings.proxy = Trasa
settings.proxy.system = Ustawienia tego komputera
settings.proxy.direct = Bezposrednio, bez proxy
settings.proxy.manual = Proxy, ktore podam
settings.proxy.note = Dla sieci, w ktorej hosty Mojanga nie odpowiadaja - zapora, antywirus, blokada dostawcy. Pliki nadal pochodza od Mojanga i nadal sa sprawdzane wzgledem hashy Mojanga; zmienia sie tylko trasa. Tylko proxy HTTP: klient HTTP Javy nie obsluguje SOCKS, wiec adres wylacznie SOCKS po cichu nic by nie robil.
settings.proxy.host = Adres
settings.proxy.port = Port
settings.proxy.user = Uzytkownik
settings.proxy.password = Haslo
settings.proxy.optional = opcjonalnie
settings.proxy.privacy = Wszystko, co launcher pobiera, idzie przez HTTPS, ktore proxy HTTP przenosi tunelem niemozliwym do odczytania. Proxy dowiaduje sie tylko, z jakimi hostami byl kontakt - zadnego tokenu konta, hasla ani zawartosci plikow. Haslo stad jest przechowywane tak jak tokeny kont, a nie w pliku ustawien, i po zapisaniu nie jest juz pokazywane.
settings.proxy.test = Sprawdz polaczenie
settings.proxy.testing = Sprawdzanie...
settings.proxy.ok = Mojang odpowiedzial. Ta trasa dziala.
settings.proxy.failed = Brak odpowiedzi: {0}
settings.proxy.incomplete = Proxy wymaga adresu i portu. Trasa pozostala bez zmian.
settings.proxy.notsaved = Nie udalo sie zapisac hasla proxy w magazynie poswiadczen tego komputera.
settings.curseforge = Klucz API CurseForge
settings.curseforge.prompt = Puste pole wyłącza CurseForge
settings.signIn = Logowanie Microsoft
settings.signIn.browser = We własnej przeglądarce
settings.signIn.deviceCode = Kodem
settings.signIn.note = Własna przeglądarka to sposób, w jaki ma się logować aplikacja natywna: widzisz pasek adresu i certyfikat Microsoftu, a menedżer haseł i pytania dwuskładnikowe działają jak zawsze. Kod jest dla maszyny bez działającej przeglądarki.
settings.handshake = Przekazuj token sesji przez standardowe wejście
settings.handshake.note = Domyślnie włączone i tak powinno zostać. Argumenty procesu może odczytać każdy program na tym komputerze i trafiają do raportów awarii; standardowe wejście nie. Wyłącz tylko wtedy, gdy loader modów z tym nie startuje.
settings.fileStore = Trzymaj dane logowania we własnym zaszyfrowanym pliku launchera
settings.fileStore.note = Domyślnie wyłączone i jest to pogorszenie: klucz do tego pliku leży obok niego. Opcja istnieje dlatego, że zablokowany lub nieobecny pęk kluczy systemu powinien być wyborem, a nie zawieszeniem.
settings.dataFolder = Folder
settings.dataFolder.note = Wszystko, co trzyma launcher: ustawienia, konta, profile, wspólne repozytorium bibliotek i zasobów, foldery instancji oraz ikony instancji.

