mods.curseforge.key.header = Klucz API CurseForge
mods.curseforge.key.body = Wklej Core API key z konsoli CurseForge for Studios. Jest przechowywany w launcher.json na tym komputerze i wysyłany tylko do CurseForge. Puste pole wyłącza CurseForge.
settings.curseforge.console = Otwórz console.curseforge.com
settings.curseforge.howto = Skąd go wziąć: otwórz console.curseforge.com, zaloguj się lub zarejestruj, potem API Keys - nadaj kluczowi dowolną nazwę i skopiuj pokazany ciąg. Zaczyna się od $2a$ i ma około sześćdziesięciu znaków. NIE bierz klucza ze strony API tokens na legacy.curseforge.com: tam wydawany jest 32-znakowy token do wysyłania własnych projektów, a api.curseforge.com odrzuca go z HTTP 403 przy każdym żądaniu.
mods.curseforge.key.wrongKind = To wygląda na Upload API token: 32 znaki szesnastkowe ze strony legacy.curseforge.com/account/api-tokens. Ten token służy do wysyłania plików do własnych projektów - api.curseforge.com to inna usługa i odrzuca go z HTTP 403 przy każdym żądaniu.\n\nLauncher potrzebuje Core API key z console.curseforge.com. Zaloguj się tam, otwórz API Keys, nadaj kluczowi nazwę i skopiuj ciąg: zaczyna się od $2a$ i ma około sześćdziesięciu znaków.
