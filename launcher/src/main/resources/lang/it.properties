settings.signIn.note = Il tuo browser è il modo in cui un'applicazione nativa dovrebbe accedere: vedi la barra degli indirizzi e il certificato di Microsoft, e il tuo gestore di password e le richieste di verifica in due passaggi funzionano come sempre. Il metodo con il codice è per una macchina senza un browser utilizzabile.
settings.handshake = Passa il token di sessione tramite lo standard input
settings.handshake.note = Attivo per impostazione predefinita, e dovrebbe restare attivo. Gli argomenti di un processo possono essere letti da ogni programma su questo computer e vengono copiati nei log dei crash; lo standard input no. Disattivalo solo se un mod loader non si avvia con questa opzione attiva.
settings.fileStore = Conserva le credenziali nel file cifrato del launcher
settings.fileStore.note = Disattivato per impostazione predefinita, ed è un peggioramento: la chiave di quel file si trova accanto al file stesso. È offerto perché un portachiavi di sistema bloccato o assente dovrebbe essere una scelta, non un blocco.
settings.dataFolder = Cartella
settings.dataFolder.note = Tutto ciò che il launcher conserva: impostazioni, account, profili, la libreria condivisa e l'archivio delle risorse, le cartelle delle istanze e le icone delle istanze.
settings.logs = Log del launcher
settings.logs.note = Ciò che ha fatto il launcher, un file per ogni esecuzione, con i cinque precedenti conservati accanto. Le credenziali vengono rimosse durante la scrittura, quindi è sicuro allegarlo a una segnalazione di bug. Il gioco tiene il proprio log nella cartella dell'istanza; il launcher annota quel percorso ogni volta che ne avvia una.
