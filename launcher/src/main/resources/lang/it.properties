settings.verify = Controlla ogni file prima di ogni avvio
settings.verify.note = Disattivato per impostazione predefinita. Il launcher rilegge un file solo quando la sua dimensione o la sua data di modifica sono cambiate dall'ultima verifica con il suo hash, ed è questo che fa durare un avvio un secondo invece di un minuto. Attivalo per leggere tutto ogni volta (circa cinquemila file per una versione moderna) e per estrarre di nuovo le librerie native dai loro jar.

settings.modWarnings = Avvisa prima di rompere una dipendenza di una mod
settings.modWarnings.note = Il launcher legge ciò che ogni jar dichiara di richiedere per avviarsi, e chiede conferma prima che tu disattivi o elimini qualcosa da cui dipendono altre mod. Disattiva questa opzione se stai smontando un'istanza e non vuoi la domanda ogni volta.
settings.modIconCache = Cache delle immagini delle mod, MB
settings.modIconCache.note = Quanto spazio della cartella dei dati possono occupare i loghi delle mod già scaricati. Vengono conservati perché l'elenco si mostri al secondo avvio anche senza connessione; quando la cartella supera questa dimensione, vengono tolti per primi quelli che nessuno guarda da più tempo. 32 MB sono circa duemila loghi. Abbassando il valore la cartella viene ripulita subito.

