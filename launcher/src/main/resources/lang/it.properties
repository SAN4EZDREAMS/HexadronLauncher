ms.notConfigured.header = L'accesso Microsoft non è configurato
ms.notConfigured.body = L'accesso Microsoft richiede un ID applicazione (client) Azure approvato da Mojang per l'autenticazione di Minecraft.\n\nRegistra un'applicazione nel portale Azure, chiedi l'approvazione a Mojang, poi inserisci l'ID client in launcher.json come "microsoftClientId".
