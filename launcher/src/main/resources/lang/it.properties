settings.proxy.manual = Un proxy che inserisco io
settings.proxy.note = Per una rete in cui gli host di Mojang non rispondono: un firewall, un antivirus, un provider che li blocca. I file arrivano comunque da Mojang e vengono comunque verificati con gli hash di Mojang; cambia solo il percorso. Solo proxy HTTP: il client HTTP di Java non parla SOCKS, quindi un indirizzo solo SOCKS non farebbe nulla, senza avvisare.
