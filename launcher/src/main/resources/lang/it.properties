settings.proxy.user = Utente
settings.proxy.password = Password
settings.proxy.optional = facoltativo
settings.proxy.privacy = Tutto ciò che il launcher scarica è HTTPS, che un proxy HTTP trasporta come un tunnel che non può leggere. Il proxy sa quali host vengono contattati e nient'altro: nessun token dell'account, nessuna password, nessun contenuto dei file. La password qui viene salvata come i token degli account, non nel file delle impostazioni, e non viene più mostrata dopo il salvataggio.
