auth.problem.noUsername.purchased = Questo account ha Minecraft: Java Edition, ma non è ancora stato scelto un nome giocatore.\n\nApri il Minecraft Launcher ufficiale, accedi con questo account e crea un nome giocatore. Poi accedi di nuovo qui.
auth.problem.noUsername.gamePass = Questo account ha Minecraft tramite Game Pass, ma non ha ancora un profilo Java Edition.\n\n1. Controlla che l''abbonamento Game Pass sia attivo e pagato: {1}\n2. Avvia Minecraft: Java Edition una volta dal Minecraft Launcher ufficiale per creare un nome giocatore.\n\nPoi accedi di nuovo qui.
auth.problem.otherGamesOnly = Questo account Microsoft ha altri giochi Minecraft (per esempio Bedrock Edition), ma non Java Edition, e non ha un Game Pass attivo.\n\n• Se giocavi con Game Pass: l''abbonamento è scaduto o non è pagato. Rinnovalo: {1}\n• Se hai comprato Java Edition: è su un altro account Microsoft. Accedi di nuovo e scegli quell''account.
auth.problem.noLicence = Questo account Microsoft non ha Minecraft: Java Edition: il gioco non è stato acquistato su di esso e non c''è un Game Pass attivo.\n\n• Se giocavi con Game Pass: l''abbonamento è scaduto o non è pagato. Rinnovalo: {1}\n• Se hai comprato Java Edition: è su un altro account Microsoft. Accedi di nuovo e scegli quell''account.
auth.problem.licenceEnded = Il nome giocatore "{0}" esiste, ma questo account ora non ha una licenza Java Edition: il gioco non è stato acquistato su di esso e non c''è un Game Pass attivo.\n\nSe giocavi con Game Pass: l''abbonamento è scaduto o non è pagato. Rinnovalo su {1}, poi accedi di nuovo.
