mods.curseforge.setKey = Aggiungi una chiave
mods.curseforge.key.header = Chiave API di CurseForge
mods.curseforge.key.body = Incolla una chiave Core API dalla console CurseForge for Studios. Viene conservata in launcher.json su questo computer e viene inviata solo a CurseForge. Un campo vuoto disattiva CurseForge.
settings.curseforge.console = Apri console.curseforge.com
settings.curseforge.howto = Come ottenerne una: apri console.curseforge.com, accedi o registrati, poi API Keys: dai alla chiave un nome qualsiasi e copia la stringa che mostra. Inizia con $2a$ ed è lunga circa sessanta caratteri. NON usare la pagina API tokens su legacy.curseforge.com: quella rilascia un token di caricamento di 32 caratteri per gli autori dei progetti, e api.curseforge.com lo rifiuta con HTTP 403 a ogni richiesta.
mods.curseforge.key.wrongKind = Sembra un token Upload API: 32 caratteri esadecimali, da legacy.curseforge.com/account/api-tokens. Quel token carica file nei progetti di tua proprietà: api.curseforge.com è un servizio diverso e lo rifiuta con HTTP 403 a ogni richiesta.\n\nA un launcher serve una chiave Core API da console.curseforge.com. Accedi lì, apri API Keys, dai un nome a una chiave e copia la stringa che mostra: inizia con $2a$ ed è lunga circa sessanta caratteri.
