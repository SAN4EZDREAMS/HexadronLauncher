settings.curseforge.howto = Cara mendapatkannya: buka console.curseforge.com, masuk atau daftar, lalu buka API Keys - beri kunci nama apa saja dan salin string yang ditampilkan. String itu diawali $2a$ dan panjangnya sekitar enam puluh karakter. JANGAN gunakan halaman API tokens di legacy.curseforge.com: halaman itu mengeluarkan token unggah 32 karakter untuk pembuat proyek, dan api.curseforge.com menolaknya dengan HTTP 403 pada setiap permintaan.
mods.curseforge.key.wrongKind = Ini tampaknya token Upload API: 32 karakter heksadesimal, dari legacy.curseforge.com/account/api-tokens. Token itu mengunggah file ke proyek milik Anda - api.curseforge.com adalah layanan yang berbeda dan menolaknya dengan HTTP 403 pada setiap permintaan.\n\nYang diperlukan launcher adalah kunci Core API dari console.curseforge.com. Masuk di sana, buka API Keys, beri nama kunci, dan salin string yang ditampilkan: string itu diawali $2a$ dan panjangnya sekitar enam puluh karakter.
