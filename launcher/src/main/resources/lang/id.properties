mods.curseforge.key.header = Kunci API CurseForge
mods.curseforge.key.body = Tempelkan kunci Core API dari konsol CurseForge for Studios. Kunci disimpan di launcher.json di komputer ini dan hanya dikirim ke CurseForge. Kolom yang kosong menonaktifkan CurseForge.
