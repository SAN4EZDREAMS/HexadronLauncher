cleanup.desc.cacheVerified = Catatan file yang sudah diperiksa. Jika dihapus, peluncuran berikutnya memeriksa setiap file lagi dan memakan waktu lebih lama.
cleanup.desc.cacheManifest = Daftar versi Minecraft. Jika dihapus, launcher tidak dapat dimulai secara offline sampai mengunduhnya lagi.
cleanup.desc.cacheOther = Data cache lainnya. Diunduh lagi saat diperlukan.
cleanup.desc.logs = Log milik launcher sendiri, dilampirkan ke laporan bug.
cleanup.desc.launcherLog = Log dari sesi launcher sebelumnya.
cleanup.desc.launcherLogCurrent = Log yang sedang ditulis saat ini.
cleanup.desc.other = Pengaturan, akun, gambar, dan file milik launcher sendiri.
cleanup.desc.icons = Gambar yang dipilih untuk profil.
cleanup.desc.iconFile = Sebuah gambar profil.
cleanup.desc.skins = Skin dan jubah yang Anda pilih, serta akun mana yang mengenakan yang mana.
cleanup.desc.skinFile = Skin atau jubah yang Anda tambahkan.
cleanup.desc.skinsIndex = Catatan akun mana yang mengenakan skin mana.
cleanup.desc.settingsFile = Pengaturan launcher.
cleanup.desc.accountsFile = Akun Anda. Jika dihapus, Anda harus masuk lagi.
cleanup.desc.profilesFile = Daftar profil dan grup. Jika dihapus, setiap profil hilang dari launcher.
cleanup.desc.secrets = Kredensial terenkripsi dari akun Anda.
cleanup.desc.wrapper = Pembantu peluncuran yang menyerahkan sesi kepada game.
cleanup.desc.agents = Sisa dari versi sebelumnya. Sekarang tidak dipakai lagi.
cleanup.desc.unknown = Sesuatu yang tidak dikenali launcher. Mungkin milik program lain.
cleanup.confirm.profiles = Profil berikut juga akan dihapus dari daftar launcher: {0}
cleanup.done.profiles = Profil yang dihapus dari daftar: {0}.
update.manual.flatpak = Launcher ini diinstal sebagai Flatpak, jadi launcher tidak mengganti dirinya sendiri: Flatpak yang melakukannya. Unduh file .flatpak yang baru dan buka - pusat perangkat lunak Anda akan memperbarui launcher di tempat, dan profil, dunia, serta akun tetap ada. Jika launcher berasal dari Flathub, cukup jalankan pembaruan di sana.
update.action.flatpak = Unduh .flatpak
