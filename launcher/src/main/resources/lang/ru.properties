settings.java.never = Никогда не загружать
settings.java.note = Среда Java - это 45-90 МБ с узла, который выбрали не вы, поэтому лаунчер сначала спрашивает. "Никогда" означает, что для сборки с нужной версией Java лаунчер лишь скажет, что установить.
settings.concurrency = Одновременных загрузок
settings.concurrency.note = Больше - быстрее на хорошей линии и хуже на слабой. Двенадцать подходит большинству соединений.
settings.proxy = Маршрут
settings.proxy.system = Настройки этого компьютера
settings.proxy.direct = Напрямую, без прокси
settings.proxy.manual = Прокси, который я укажу
settings.proxy.note = Для сети, где хосты Mojang не отвечают — фаервол, антивирус, блокировка провайдером. Файлы по-прежнему приходят от Mojang и по-прежнему проверяются по хешам Mojang; меняется только маршрут. Только HTTP-прокси: HTTP-клиент Java не умеет SOCKS, поэтому адрес только с SOCKS молча ничего бы не делал.
settings.proxy.host = Адрес
settings.proxy.port = Порт
settings.proxy.user = Пользователь
settings.proxy.password = Пароль
settings.proxy.optional = необязательно
settings.proxy.privacy = Всё, что загружает лаунчер, идёт по HTTPS, а HTTP-прокси ведёт его туннелем, который не может прочитать. Прокси узнаёт только, к каким хостам было обращение — ни токена аккаунта, ни пароля, ни содержимого файлов. Пароль отсюда хранится так же, как токены аккаунтов, а не в файле настроек, и после сохранения больше не показывается.
settings.proxy.test = Проверить соединение
settings.proxy.testing = Проверка...
settings.proxy.ok = Mojang ответил. Этот маршрут работает.
settings.proxy.failed = Ответа нет: {0}
settings.proxy.incomplete = Для прокси нужны адрес и порт. Маршрут оставлен без изменений.
settings.proxy.notsaved = Не удалось сохранить пароль прокси в хранилище учётных данных этого компьютера.
settings.curseforge = Ключ API CurseForge
settings.curseforge.prompt = Пустое поле выключает CurseForge
settings.signIn = Вход через Microsoft
settings.signIn.browser = В собственном браузере
settings.signIn.deviceCode = Кодом
settings.signIn.note = Собственный браузер - это то, как должна входить нативная программа: вы видите адресную строку и сертификат Microsoft, а менеджер паролей и двухфакторные запросы работают как всегда. Вход кодом - для машины без пригодного браузера.
settings.handshake = Передавать токен сессии через стандартный ввод
settings.handshake.note = Включено по умолчанию и должно таким остаться. Аргументы процесса может прочитать любая программа на этом компьютере, и они копируются в отчёты о сбое; стандартный ввод - нет. Выключайте только если загрузчик модов не стартует с этим.
settings.fileStore = Держать данные входа в собственном зашифрованном файле лаунчера
settings.fileStore.note = Выключено по умолчанию, и это ухудшение: ключ к тому файлу лежит рядом с ним. Опция существует потому, что заблокированное или отсутствующее системное хранилище должно быть выбором, а не зависанием.
settings.dataFolder = Папка
settings.dataFolder.note = Всё, что держит лаунчер: настройки, аккаунты, профили, общее хранилище библиотек и ресурсов, папки сборок и значки сборок.
settings.logs = Журнал лаунчера
settings.logs.note = Что делал лаунчер: один файл на запуск, рядом хранятся пять предыдущих. Учётные данные вырезаются при записи, поэтому файл безопасно прикладывать к отчёту об ошибке. Игра ведёт свой журнал в папке сборки; лаунчер записывает этот путь каждый раз, когда её запускает.
