settings.grid.refusedColumns = Колонок осталось {0}: части сборок было бы некуда переехать. Сначала добавьте ряд или переместите часть сборок вручную.
settings.grid.refusedRows = Рядов осталось {0}: части сборок было бы некуда переехать. Сначала добавьте колонку или переместите часть сборок вручную.
settings.splash = Окно запуска, секунд
settings.splash.note = Минимальное время показа окна запуска. Ноль снимает ограничение. Клик или клавиша всегда закрывают его раньше.
settings.keepOpen = Держать лаунчер открытым во время игры
settings.tray = Скрывать в область уведомлений во время игры
settings.tray.note = Окно возвращается само, когда игра закрывается. Через значок в области уведомлений игру также можно остановить.
settings.verify = Проверять все файлы перед каждым запуском
settings.verify.note = Выключено по умолчанию. Лаунчер перечитывает файл только тогда, когда его длина или время изменения отличаются от тех, с которыми его в последний раз сверяли по хешу — именно поэтому запуск занимает секунду, а не минуту. Включите, чтобы каждый раз читать всё — около пяти тысяч файлов для современной версии — и заново распаковывать нативные библиотеки из их jar.

settings.modWarnings = Предупреждать, когда мод нужен другим модам
settings.modWarnings.note = Лаунчер читает, что именно каждый jar требует для запуска, и спрашивает, прежде чем вы выключите или удалите то, от чего зависят другие моды. Выключите, если разбираете сборку и не хотите отвечать на этот вопрос каждый раз.
settings.modIconCache = Кеш изображений модов, МБ
settings.modIconCache.note = Сколько места в папке данных могут занимать уже загруженные значки модов. Они хранятся, чтобы при втором запуске список рисовался без соединения; когда папка перерастает этот размер, первыми исчезают те, на которые дольше всего никто не смотрел. 32 МБ - это примерно две тысячи значков. Если уменьшить, папка будет очищена сразу.

