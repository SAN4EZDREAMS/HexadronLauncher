cleanup.safe.versions.tip = Các phiên bản đã từng được cài mà hiện không hồ sơ nào chạy, và không phiên bản nào khác được dựng dựa trên chúng. Hồ sơ nào cần lại một phiên bản sẽ tải nó ở lần khởi chạy tiếp theo.
cleanup.reason.versions = {0} phiên bản không hồ sơ nào dùng.
