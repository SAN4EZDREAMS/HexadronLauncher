cleanup.cleaning = Đang dọn dẹp...
cleanup.progress.deleting = Đang xóa {0}...
cleanup.scan.references = Đang xác định những gì các hồ sơ sử dụng...
cleanup.scan.instances = Đang đo các bản cài...
cleanup.scan.versions = Đang đo các phiên bản...
