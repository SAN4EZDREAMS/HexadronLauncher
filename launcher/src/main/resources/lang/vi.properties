cleanup.mode.safe.tip = Chỉ đề xuất những gì trình khởi chạy có thể chứng minh là nó không dùng: các phiên bản không hồ sơ nào chạy, thư viện và tài nguyên không phiên bản đã cài nào nhắc tới, các tệp tải xuống đã được giải nén. Không có gì bên trong thư mục bản cài - thế giới, mod, cấu hình - bị động đến ở đây.
cleanup.mode.advanced.tip = Hiển thị toàn bộ thư mục dữ liệu dưới dạng cây và cho phép bạn chọn bất cứ thứ gì, kể cả thế giới và mod. Chỉ dành cho người chơi có kinh nghiệm: một sai lầm ở đây có thể làm hỏng bản cài và mất thế giới.
cleanup.tile.total = Dữ liệu trình khởi chạy
