cleanup.safe.libraries = Thư viện không phiên bản nào cần
cleanup.safe.libraries.tip = Các thư viện Java mà không phiên bản đã cài nào nhắc tới. Chúng được đưa vào bởi các phiên bản hoặc trình tải đã bị xóa hoặc cập nhật. Các nhóm mà Forge và NeoForge ghi vào được giữ lại khi còn cài một trong hai.
cleanup.reason.libraries = {0} tệp không phiên bản đã cài nào tham chiếu tới.
cleanup.safe.assets = Tài nguyên trò chơi không dùng đến
cleanup.safe.assets.tip = Âm thanh, kết cấu và tệp ngôn ngữ không có trong chỉ mục tài nguyên của phiên bản đã cài nào - do các phiên bản đã bị xóa để lại.
cleanup.reason.assets = {0} tệp không phiên bản đã cài nào liệt kê.
cleanup.safe.java = Môi trường chạy Java không dùng đến
cleanup.safe.java.tip = Các môi trường chạy Java do trình khởi chạy tải về mà không hồ sơ nào yêu cầu. Các bản cài Java của riêng bạn không bao giờ bị động đến. Nếu một hồ sơ lại cần đến, trình khởi chạy sẽ đề nghị tải xuống.
cleanup.reason.java = Không hồ sơ nào cần các phiên bản Java này.
cleanup.safe.cache-modpacks = Tệp nén modpack đã tải xuống
cleanup.safe.cache-modpacks.tip = Các tệp nén .mrpack và .zip của modpack đã cài. Gói đã được giải nén vào bản cài của nó; tệp nén chỉ là bản sao của những gì đã tải xuống.
cleanup.reason.cache-modpacks = {0} tệp nén đã được giải nén vào bản cài.
cleanup.safe.cache-loaders = Trình cài đặt Forge và NeoForge
cleanup.safe.cache-loaders.tip = Các tệp jar trình cài đặt được giữ lại sau khi cài Forge hoặc NeoForge. Chúng chỉ cần lại khi cài đặt lại, và sẽ được tải xuống vào lúc đó.
cleanup.reason.cache-loaders = {0} trình cài đặt đã cài xong.
cleanup.safe.cache-java = Tệp nén tải xuống của Java
cleanup.safe.cache-java.tip = Các tệp nén mà môi trường chạy Java được giải nén từ đó. Bản thân các môi trường chạy vẫn được giữ.
cleanup.reason.cache-java = {0} tệp nén đã được giải nén.
cleanup.safe.cache-mod-icons = Bộ nhớ đệm biểu tượng mod
cleanup.safe.cache-mod-icons.tip = Logo của mod, gói và danh mục được lưu để danh sách mở nhanh. Chúng được tải lại khi một danh sách hiển thị chúng.
