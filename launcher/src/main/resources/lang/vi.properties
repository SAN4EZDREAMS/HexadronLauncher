cleanup.scan.candidates = Đang tìm những gì không dùng đến...
cleanup.blocked.header = Không thể bắt đầu dọn dẹp lúc này
cleanup.blocked.playing = Trò chơi đang chạy. Hãy đóng nó trước: nó đang giữ mở phiên bản, thư viện và Java của mình.
cleanup.blocked.busy = Trình khởi chạy đang bận. Hãy chờ tác vụ hiện tại hoàn tất.
cleanup.confirm.title = Xác nhận dọn dẹp
cleanup.confirm.header.safe = Giải phóng {1} bằng cách xóa {0} mục?
cleanup.confirm.header.advanced = Xóa vĩnh viễn {0} mục, {1}?
cleanup.confirm.body.safe = Trình khởi chạy không dùng các tệp này. Nếu có lúc cần lại một tệp, nó sẽ được tải lại.
cleanup.confirm.body.advanced = Các mục này bị xóa vĩnh viễn, không được chuyển vào Thùng rác.
cleanup.confirm.gameData = Lựa chọn có bao gồm tệp của bản cài. Thế giới, mod và cài đặt trong đó sẽ bị mất vĩnh viễn.
cleanup.confirm.sure = Tôi đã kiểm tra danh sách và muốn xóa
cleanup.confirm.delete.safe = Giải phóng dung lượng
cleanup.confirm.delete.advanced = Xóa vĩnh viễn
cleanup.done = Xong: đã giải phóng {0}
cleanup.done.header = Đã dọn dẹp xong
cleanup.done.body = Đã giải phóng {0}.
cleanup.partial.header = Đã dọn dẹp xong, nhưng không phải mọi thứ đều bị xóa
cleanup.partial.body = Đã giải phóng {0}. Không thể xóa {1} mục - thường là tệp mà một chương trình khác vẫn đang mở:
cleanup.failed = Dọn dẹp thất bại
cleanup.failed.body = Không có gì bị xóa thêm. Nhật ký trình khởi chạy có thông tin chi tiết.
cleanup.tip.size = Kích thước: {0}, số tệp: {1}
cleanup.tip.path = Vị trí: {0}
cleanup.tip.locked = Được bảo vệ: trình khởi chạy cần thứ này để hoạt động, nên không thể xóa nó ở đây.
cleanup.note.usedBy = Được dùng bởi: {0}
cleanup.note.parent = Được một phiên bản đã cài khác cần đến
cleanup.note.unused = Không dùng đến
cleanup.note.inUse = Đang được dùng
cleanup.note.javaUnknown = Không thể biết nó có đang được dùng hay không
cleanup.note.protected = Được bảo vệ
cleanup.note.folder = Thư mục: {0}
cleanup.note.noProfile = Không thuộc hồ sơ nào
cleanup.desc.dataRoot = Thư mục dữ liệu của trình khởi chạy.
cleanup.desc.instances = Các thư mục bản cài: mỗi hồ sơ một thư mục, cùng các thế giới, mod, gói tài nguyên, shader và cài đặt của nó. Đây là dữ liệu trò chơi của bạn.
cleanup.desc.profile = Thư mục trò chơi của hồ sơ "{0}": các thế giới, mod, gói và cài đặt của nó. Nếu chọn toàn bộ, hồ sơ sẽ bị xóa khỏi trình khởi chạy cùng tất cả tệp của nó, giống hệt nút Xóa. Chỉ chọn những gì bên trong để giữ lại hồ sơ.
cleanup.desc.orphanInstance = Một thư mục bản cài không hồ sơ nào trỏ tới - thường là của một hồ sơ đã bị xóa với tùy chọn "giữ lại tệp". Nó vẫn có thể chứa những thế giới và mod đáng giữ lại.
cleanup.desc.deleting = Các tệp của hồ sơ đã xóa mà trình khởi chạy chưa xóa xong. Có thể xóa an toàn.
cleanup.desc.saves = Các thế giới đã lưu. Xóa mục này sẽ xóa mọi thế giới của bản cài.
cleanup.desc.world = Một thế giới đã lưu: địa hình, túi đồ, tiến trình. Một khi bị xóa, nó sẽ mất vĩnh viễn.
cleanup.desc.mods = Các mod của bản cài. Mod được cài từ danh mục có thể cài lại; các tệp jar của riêng bạn thì không.
cleanup.desc.modFile = Một mod. Bản cài có thể không khởi động được nếu thiếu nó khi các mod khác phụ thuộc vào nó.
cleanup.desc.removedBin = Các mod bạn đã xóa, được giữ ở đây khi Thùng rác không khả dụng.
cleanup.desc.config = Cài đặt mod. Xóa sẽ đặt lại mọi mod về mặc định.
cleanup.desc.defaultconfigs = Cài đặt mặc định mà một modpack áp dụng cho thế giới mới.
cleanup.desc.configEntry = Cài đặt của một mod. Một khi bị xóa, mod sẽ khởi động với cài đặt mặc định.
cleanup.desc.resourcepacks = Gói tài nguyên: kết cấu, âm thanh và mô hình.
cleanup.desc.shaderpacks = Gói shader cho Iris, OptiFine hoặc Canvas.
cleanup.desc.packFile = Một gói tài nguyên hoặc gói shader.
cleanup.desc.screenshots = Ảnh chụp màn hình trong trò chơi (F2).
cleanup.desc.screenshot = Một ảnh chụp màn hình.
cleanup.desc.gameLogs = Nhật ký trò chơi. Hữu ích khi có sự cố, ngoài ra có thể xóa an toàn.
cleanup.desc.gameLogFile = Một tệp nhật ký trò chơi.
cleanup.desc.crashReports = Các báo cáo sự cố do trò chơi ghi.
cleanup.desc.crashReport = Một báo cáo sự cố. Chỉ cần đến khi muốn tìm hiểu vì sao trò chơi gặp sự cố.
cleanup.desc.options = Cài đặt trò chơi: điều khiển, hình ảnh, âm thanh, các gói tài nguyên đang bật. Một khi bị xóa, trò chơi sẽ khởi động với cài đặt mặc định.
cleanup.desc.servers = Danh sách máy chủ của màn hình nhiều người chơi.
cleanup.desc.scripts = Các script của một modpack (KubeJS, CraftTweaker). Modpack có thể không hoạt động nếu thiếu chúng.
cleanup.desc.schematics = Các công trình đã lưu của Litematica, WorldEdit và các mod tương tự.
cleanup.desc.schematicFile = Một công trình đã lưu.
cleanup.desc.loaderCache = Bộ nhớ đệm do trình tải mod ghi. Được dựng lại ở lần khởi động tiếp theo.
cleanup.desc.legacyResources = Tài nguyên của các phiên bản rất cũ, được trình khởi chạy sao chép vào đây. Được khôi phục ở lần khởi động tiếp theo.
cleanup.desc.userCache = Tên người chơi mà trò chơi đã gặp. Được trò chơi dựng lại.
cleanup.desc.bookkeeping = Bản ghi của trình khởi chạy về những gì nó đã cài ở đây. Một khi bị xóa, các tệp vẫn còn nhưng được hiển thị như thể không do trình khởi chạy cài.
cleanup.desc.instanceFolder = Một thư mục do trò chơi hoặc một mod tạo ra.
cleanup.desc.instanceFile = Một tệp do trò chơi hoặc một mod tạo ra.
cleanup.desc.versions = Các phiên bản Minecraft, Fabric, Quilt, Forge và NeoForge đã cài.
cleanup.desc.version = Phiên bản {0}: tệp kê khai và tệp jar trò chơi của nó. Xóa một phiên bản mà hồ sơ đang dùng sẽ khiến trình khởi chạy tải lại nó ở lần khởi chạy tiếp theo.
cleanup.desc.natives = Các thư viện gốc được giải nén cho từng phiên bản. Được giải nén lại mỗi khi một phiên bản khởi động.
cleanup.desc.nativesEntry = Các thư viện gốc cho {0}. Được giải nén lại khi phiên bản đó khởi động.
cleanup.desc.libraries = Kho thư viện Java dùng chung mà mọi phiên bản lấy từ đó.
cleanup.desc.libraryGroup = Các thư viện của {0}. Xóa những thư viện mà một phiên bản cần sẽ khiến trình khởi chạy tải lại chúng - Forge và NeoForge có thể cần được cài đặt lại.
cleanup.desc.assets = Âm thanh, kết cấu và bản dịch dùng chung giữa các phiên bản.
cleanup.desc.assetObjects = Mọi tệp tài nguyên, được đặt tên theo mã băm của nó. Xóa tất cả sẽ khiến mọi phiên bản tải lại tài nguyên của mình - mỗi phiên bản vài trăm MB.
cleanup.desc.asset.indexes = Chỉ mục tài nguyên: danh sách các tệp mà mỗi phiên bản cần.
cleanup.desc.asset.indexes.entry = Danh sách tài nguyên của {0}.
cleanup.desc.asset.virtual = Các bản sao tài nguyên được sắp xếp cho những phiên bản rất cũ.
cleanup.desc.asset.virtual.entry = Các bản sao tài nguyên cho {0}.
cleanup.desc.asset.log_configs = Cài đặt ghi nhật ký của trò chơi.
cleanup.desc.asset.log_configs.entry = Cài đặt ghi nhật ký {0}.
cleanup.desc.assetOther = Dữ liệu tài nguyên khác.
cleanup.desc.java = Các môi trường chạy Java do trình khởi chạy tải về. Các bản cài Java của riêng bạn không nằm ở đây.
cleanup.desc.javaRuntime = Java {0}, do trình khởi chạy tải về. Các hồ sơ cần đến nó sẽ đề nghị tải lại.
cleanup.desc.javaOther = Một thư mục trong thư mục Java mà trình khởi chạy không tự đặt vào đó.
cleanup.desc.cache = Các tệp tải xuống được giữ lại để khỏi phải tải lại.
cleanup.desc.cacheModpacks = Tệp nén của các modpack đã cài. Các modpack đã được giải nén.
cleanup.desc.cacheLoaders = Trình cài đặt Forge và NeoForge. Chỉ cần khi cài đặt lại.
cleanup.desc.cacheJava = Các tệp nén mà Java được giải nén từ đó.
cleanup.desc.cacheModIcons = Logo đã lưu của mod và gói.
cleanup.desc.cacheVerified = Bản ghi các tệp đã được kiểm tra. Một khi bị xóa, lần khởi chạy tiếp theo sẽ kiểm tra lại mọi tệp và mất nhiều thời gian hơn.
cleanup.desc.cacheManifest = Danh sách các phiên bản Minecraft. Một khi bị xóa, trình khởi chạy không thể khởi động ngoại tuyến cho đến khi tải lại danh sách.
cleanup.desc.cacheOther = Dữ liệu đệm khác. Được tải lại khi cần.
cleanup.desc.logs = Nhật ký riêng của trình khởi chạy, dùng để đính kèm vào báo cáo lỗi.
cleanup.desc.launcherLog = Nhật ký của một phiên trình khởi chạy trước đây.
cleanup.desc.launcherLogCurrent = Nhật ký đang được ghi ngay lúc này.
cleanup.desc.other = Cài đặt, tài khoản, ảnh và các tệp riêng của trình khởi chạy.
cleanup.desc.icons = Các ảnh được chọn cho hồ sơ.
cleanup.desc.iconFile = Một ảnh hồ sơ.
cleanup.desc.skins = Skin và áo choàng bạn đã chọn, và tài khoản nào mặc cái nào.
cleanup.desc.skinFile = Một skin hoặc áo choàng bạn đã thêm.
cleanup.desc.skinsIndex = Bản ghi tài khoản nào mặc skin nào.
cleanup.desc.settingsFile = Cài đặt của trình khởi chạy.
cleanup.desc.accountsFile = Các tài khoản của bạn. Một khi bị xóa, bạn sẽ phải đăng nhập lại.
cleanup.desc.profilesFile = Danh sách hồ sơ và nhóm. Một khi bị xóa, mọi hồ sơ sẽ biến mất khỏi trình khởi chạy.
cleanup.desc.secrets = Thông tin đăng nhập đã mã hóa của các tài khoản của bạn.
cleanup.desc.wrapper = Công cụ hỗ trợ khởi chạy trao phiên đăng nhập cho trò chơi.
cleanup.desc.agents = Agent skin được gắn vào trò chơi.
cleanup.desc.unknown = Thứ mà trình khởi chạy không nhận ra. Nó có thể thuộc về một chương trình khác.
cleanup.confirm.profiles = Các hồ sơ này cũng sẽ bị xóa khỏi danh sách của trình khởi chạy: {0}
cleanup.done.profiles = Các hồ sơ đã bị xóa khỏi danh sách: {0}.
update.manual.flatpak = Trình khởi chạy này được cài dưới dạng Flatpak, nên nó không tự thay thế chính mình: Flatpak làm việc đó. Hãy tải tệp .flatpak mới và mở nó - trung tâm phần mềm của bạn sẽ cập nhật trình khởi chạy tại chỗ, còn hồ sơ, thế giới và tài khoản được giữ nguyên. Nếu bạn cài từ Flathub, chỉ cần chạy các bản cập nhật ở đó.
update.action.flatpak = Tải xuống .flatpak
