cleanup.notice.unresolved = Không đọc được phiên bản của ít nhất một hồ sơ, nên thư viện và tài nguyên không được đề xuất - không thể biết hồ sơ đó cần những thứ nào. Cài đặt hoặc sửa chữa hồ sơ đó sẽ khắc phục điều này.
cleanup.notice.assetsUnknown = Một phiên bản đã cài không có chỉ mục tài nguyên trên ổ đĩa, nên tài nguyên trò chơi không được đề xuất. Khởi chạy phiên bản đó một lần sẽ khắc phục điều này.
cleanup.notice.javaUnknown = Ít nhất một hồ sơ không có phiên bản Java được ghi lại, nên môi trường chạy Java không được đề xuất.
cleanup.advanced.warning.title = Chế độ nâng cao: hãy hết sức cẩn thận!
cleanup.advanced.warning.body = Mọi thứ ở đây bị xóa vĩnh viễn, không qua Thùng rác. Chọn một bản cài, các bản lưu hoặc các mod của nó sẽ xóa thế giới, công trình và cài đặt của bạn - chúng không thể khôi phục. Xóa phiên bản, thư viện hoặc Java sẽ khiến trình khởi chạy tải chúng lại. Di chuột lên bất kỳ hàng nào để xem nó là gì trước khi chọn.
cleanup.advanced.understood = Tôi hiểu rằng việc này có thể làm hỏng bản cài, mod và các thế giới đã lưu của tôi
cleanup.advanced.firstUnderstand = Hãy đánh dấu vào ô bên dưới cảnh báo trước.
cleanup.filter.prompt = Tìm theo tên...
cleanup.collapse = Thu gọn tất cả
cleanup.tree.empty = Không có gì để hiển thị
cleanup.tree.summary = Đang hiện {0} hàng. Nhấp đúp vào một hàng, hoặc nhấp vào mũi tên của nó, để mở.
cleanup.row.chosen = đã chọn {0}
