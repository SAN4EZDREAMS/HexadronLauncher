auth.problem.noUsername.purchased = Bu hesapta Minecraft: Java Edition var, ancak henüz bir oyuncu adı seçilmedi.\n\nResmî Minecraft Launcher''ı açın, bu hesapla giriş yapın ve bir oyuncu adı oluşturun. Sonra burada tekrar giriş yapın.
