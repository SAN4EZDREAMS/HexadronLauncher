mods.curseforge.key.body = CurseForge for Studios konsolundan bir Core API anahtarı yapıştırın. Anahtar bu bilgisayarda launcher.json içinde tutulur ve yalnızca CurseForge'a gönderilir. Alan boş bırakılırsa CurseForge kapanır.
