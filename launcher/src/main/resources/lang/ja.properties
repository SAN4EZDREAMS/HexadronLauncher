settings.modIconCache = Mod 画像のキャッシュ（MB）
settings.modIconCache.note = 取得済みの Mod のロゴがデータフォルダー内で使える容量です。ロゴは、2 回目以降の起動時に接続なしでリストを表示できるように保存されます。フォルダーがこのサイズを超えると、最も長い間表示されていないものから削除されます。32 MB でロゴ約 2,000 個分です。値を下げると、すぐにフォルダーが整理されます。

