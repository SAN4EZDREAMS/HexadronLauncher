ms.notConfigured.header = Microsoft サインインが設定されていません
ms.notConfigured.body = Microsoft サインインには、Minecraft の認証用に Mojang が承認した Azure アプリケーション（クライアント）ID が必要です。\n\nAzure ポータルでアプリケーションを登録し、Mojang に承認を申請してから、クライアント ID を launcher.json の "microsoftClientId" に設定してください。
ms.signIn.header = Microsoft でサインイン
ms.signIn.body = 次のページを開いて\n{0}\n\nこのコードを入力してください：\n\n{1}\n\nこのウィンドウは開いたままで構いません。ランチャーはサインインを待っています。
auth.problem.noUsername.purchased = このアカウントには Minecraft: Java Edition がありますが、プレイヤー名がまだ作成されていません。\n\n公式の Minecraft Launcher を開き、このアカウントでサインインしてプレイヤー名を作成してください。その後、ここでもう一度サインインしてください。
auth.problem.noUsername.gamePass = このアカウントでは Game Pass で Minecraft を利用できますが、Java Edition のプロフィールがまだありません。\n\n1. Game Pass のサブスクリプションが有効で、支払い済みか確認してください: {1}\n2. プレイヤー名を作成するため、公式の Minecraft Launcher から Minecraft: Java Edition を一度起動してください。\n\nその後、ここでもう一度サインインしてください。
auth.problem.otherGamesOnly = この Microsoft アカウントには他の Minecraft ゲーム (例: Bedrock Edition) がありますが、Java Edition はなく、有効な Game Pass もありません。\n\n• Game Pass でプレイしていた場合: サブスクリプションが終了したか、未払いです。更新してください: {1}\n• Java Edition を購入した場合: 別の Microsoft アカウントにあります。もう一度サインインして、そのアカウントを選んでください。
auth.problem.noLicence = この Microsoft アカウントには Minecraft: Java Edition がありません。このアカウントでゲームは購入されておらず、有効な Game Pass もありません。\n\n• Game Pass でプレイしていた場合: サブスクリプションが終了したか、未払いです。更新してください: {1}\n• Java Edition を購入した場合: 別の Microsoft アカウントにあります。もう一度サインインして、そのアカウントを選んでください。
auth.problem.licenceEnded = プレイヤー名「{0}」は存在しますが、このアカウントには現在 Java Edition のライセンスがありません。このアカウントでゲームは購入されておらず、有効な Game Pass もありません。\n\nGame Pass でプレイしていた場合: サブスクリプションが終了したか、未払いです。{1} で更新してから、もう一度サインインしてください。
