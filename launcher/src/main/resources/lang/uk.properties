cleanup.nothingIn = У категорії {0} нічого чистити
cleanup.safe.deleting = Залишки видалених профілів
cleanup.safe.deleting.tip = Файли профілів, які ви видалили, але лаунчер не встиг прибрати - зазвичай тому, що його закрили під час видалення. На них більше ніщо не посилається.
