ms.notConfigured.header = Вхід через Microsoft не налаштовано
ms.notConfigured.body = Для входу через Microsoft потрібен ідентифікатор застосунку Azure (client ID), схвалений Mojang для автентифікації Minecraft.\n\nЗареєструйте застосунок у порталі Azure, подайте його на схвалення Mojang, а потім впишіть client ID у launcher.json як "microsoftClientId".
ms.signIn.header = Вхід через Microsoft
ms.signIn.body = Відкрийте\n{0}\n\nі введіть цей код:\n\n{1}\n\nЦе вікно можна не закривати; лаунчер чекає.
auth.problem.noUsername.purchased = На цьому акаунті є Minecraft: Java Edition, але ім''я гравця ще не створено.\n\nВідкрийте офіційний Minecraft Launcher, увійдіть цим акаунтом і створіть ім''я гравця. Потім увійдіть тут ще раз.
auth.problem.noUsername.gamePass = На цьому акаунті Minecraft доступний через Game Pass, але профілю Java Edition ще немає.\n\n1. Перевірте, що підписка Game Pass активна й оплачена: {1}\n2. Запустіть Minecraft: Java Edition один раз з офіційного Minecraft Launcher, щоб створити ім''я гравця.\n\nПотім увійдіть тут ще раз.
auth.problem.otherGamesOnly = На цьому акаунті Microsoft є інші ігри Minecraft (наприклад, Bedrock Edition), але немає Java Edition і немає активного Game Pass.\n\n• Якщо ви грали через Game Pass: підписка закінчилася або не оплачена. Поновіть її: {1}\n• Якщо ви купували Java Edition: гра на іншому акаунті Microsoft. Увійдіть ще раз і виберіть той акаунт.
auth.problem.noLicence = На цьому акаунті Microsoft немає Minecraft: Java Edition: гру на ньому не купували, і активного Game Pass немає.\n\n• Якщо ви грали через Game Pass: підписка закінчилася або не оплачена. Поновіть її: {1}\n• Якщо ви купували Java Edition: гра на іншому акаунті Microsoft. Увійдіть ще раз і виберіть той акаунт.
auth.problem.licenceEnded = Ім''я гравця "{0}" існує, але зараз на цьому акаунті немає ліцензії Java Edition: гру на ньому не купували, і активного Game Pass немає.\n\nЯкщо ви грали через Game Pass: підписка закінчилася або не оплачена. Поновіть її на {1} і увійдіть ще раз.
