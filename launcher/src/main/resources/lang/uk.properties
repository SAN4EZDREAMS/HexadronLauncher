settings.curseforge.howto = Де його взяти: відкрийте console.curseforge.com, увійдіть або зареєструйтеся, далі API Keys - дайте ключу будь-яку назву й скопіюйте рядок, який з'явиться. Він починається з $2a$ і має близько шістдесяти символів. НЕ беріть ключ зі сторінки API tokens на legacy.curseforge.com: там видають 32-символьний токен для завантаження власних проєктів, і api.curseforge.com відмовляє йому з HTTP 403 на кожному запиті.
mods.curseforge.key.wrongKind = Це схоже на Upload API token: 32 шістнадцяткові символи зі сторінки legacy.curseforge.com/account/api-tokens. Той токен призначений для завантаження файлів у ваші власні проєкти - api.curseforge.com це інша служба, і вона відмовляє йому з HTTP 403 на кожному запиті.\n\nЛаунчеру потрібен Core API key з console.curseforge.com. Увійдіть там, відкрийте API Keys, дайте ключу назву й скопіюйте рядок: він починається з $2a$ і має близько шістдесяти символів.
