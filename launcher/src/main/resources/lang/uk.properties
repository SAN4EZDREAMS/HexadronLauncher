cleanup.safe.cache-mod-icons = Кеш іконок модів
cleanup.safe.cache-mod-icons.tip = Логотипи модів, паків і категорій, збережені, щоб списки відкривалися швидко. Вони завантажаться знову, коли список їх покаже.
