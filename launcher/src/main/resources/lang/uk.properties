settings.splash = Вікно запуску, секунд
settings.splash.note = Мінімальний час показу вікна запуску. Нуль знімає обмеження. Клік або клавіша завжди закривають його раніше.
settings.keepOpen = Тримати лаунчер відкритим під час гри
settings.tray = Ховати в область повідомлень під час гри
settings.tray.note = Вікно повертається саме, коли гра закривається. Через значок в області повідомлень гру також можна зупинити.
settings.verify = Перевіряти всі файли перед кожним запуском
settings.verify.note = Вимкнено за замовчуванням. Лаунчер перечитує файл лише тоді, коли його довжина або час зміни відрізняються від тих, з якими його востаннє звіряли за хешем — саме тому запуск триває секунду, а не хвилину. Увімкніть, щоб щоразу читати все — близько п'яти тисяч файлів для сучасної версії — і заново розпаковувати нативні бібліотеки з їхніх jar.

settings.modWarnings = Попереджати, коли мод потрібен іншим модам
settings.modWarnings.note = Лаунчер читає, що саме кожен jar вимагає для запуску, і питає, перш ніж ви вимкнете чи видалите те, від чого залежать інші моди. Вимкніть, якщо розбираєте збірку і не хочете відповідати на це питання щоразу.
settings.modIconCache = Кеш зображень модів, МБ
settings.modIconCache.note = Скільки місця в теці даних можуть займати вже завантажені значки модів. Вони зберігаються, щоб при другому запуску список малювався без з’єднання; коли тека переростає цей розмір, першими зникають ті, на які ніхто найдовше не дивився. 32 МБ - це приблизно дві тисячі значків. Якщо зменшити, теку буде очищено одразу.

