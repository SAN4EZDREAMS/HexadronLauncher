settings.tray = Ховати в область повідомлень під час гри
settings.tray.note = Вікно повертається саме, коли гра закривається. Через значок в області повідомлень гру також можна зупинити.
settings.verify = Перевіряти всі файли перед кожним запуском
settings.verify.note = Вимкнено за замовчуванням. Лаунчер перечитує файл лише тоді, коли його довжина або час зміни відрізняються від тих, з якими його востаннє звіряли за хешем — саме тому запуск триває секунду, а не хвилину. Увімкніть, щоб щоразу читати все — близько п'яти тисяч файлів для сучасної версії — і заново розпаковувати нативні бібліотеки з їхніх jar.
settings.java = Коли Java немає
settings.java.ask = Питати щоразу
settings.java.always = Завантажувати
settings.java.never = Ніколи не завантажувати
settings.java.note = Середовище Java - це 45-90 МБ з вузла, який вибрали не ви, тому лаунчер питає спершу. "Ніколи" означає, що для збірки з потрібною версією Java лаунчер лише скаже, що встановити.
settings.concurrency = Одночасних завантажень
settings.concurrency.note = Більше - швидше на добрій лінії і гірше на слабкій. Дванадцять підходить для більшості з'єднань.
settings.proxy = Маршрут
settings.proxy.system = Налаштування цього комп'ютера
settings.proxy.direct = Напряму, без проксі
settings.proxy.manual = Проксі, який я вкажу
settings.proxy.note = Для мережі, де хости Mojang не відповідають — фаєрвол, антивірус, блокування провайдером. Файли й далі надходять від Mojang і й далі перевіряються за хешами Mojang; змінюється лише маршрут. Лише HTTP-проксі: HTTP-клієнт Java не вміє SOCKS, тож адреса лише з SOCKS тихо нічого не робила б.
settings.proxy.host = Адреса
settings.proxy.port = Порт
settings.proxy.user = Користувач
settings.proxy.password = Пароль
settings.proxy.optional = необов'язково
settings.proxy.privacy = Усе, що завантажує лаунчер, іде через HTTPS, а HTTP-проксі веде його тунелем, який не може прочитати. Проксі дізнається лише, до яких хостів було звернення — ані токена акаунта, ані пароля, ані вмісту файлів. Пароль звідси зберігається так само, як токени акаунтів, а не у файлі налаштувань, і після збереження більше не показується.
settings.proxy.test = Перевірити з'єднання
settings.proxy.testing = Перевірка...
settings.proxy.ok = Mojang відповів. Цей маршрут працює.
settings.proxy.failed = Відповіді немає: {0}
settings.proxy.incomplete = Для проксі потрібні адреса і порт. Маршрут залишено без змін.
settings.proxy.notsaved = Не вдалося зберегти пароль проксі у сховищі облікових даних цього комп'ютера.
