cleanup.desc.dataRoot = Тека даних лаунчера.
cleanup.desc.instances = Теки збірок: по одній на профіль, зі світами, модами, ресурспаками, шейдерами й налаштуваннями. Це ваші ігрові дані.
cleanup.desc.profile = Тека гри профілю "{0}": світи, моди, паки й налаштування. Якщо відмітити її повністю, профіль буде видалено з лаунчера разом з усіма файлами - так само, як кнопкою «Видалити». Щоб профіль лишився, відмічайте лише те, що всередині.
cleanup.desc.orphanInstance = Тека збірки, на яку не вказує жоден профіль - найчастіше профіль, видалений із варіантом «файли лишити». У ній можуть бути світи й моди, які варто зберегти.
cleanup.desc.deleting = Файли видалених профілів, які лаунчер ще не доприбрав. Можна видаляти.
cleanup.desc.saves = Збережені світи. Видалення знищить усі світи цієї збірки.
cleanup.desc.world = Збережений світ: місцевість, інвентар, прогрес. Після видалення його не повернути.
cleanup.desc.mods = Моди збірки. Моди з каталогу можна встановити знову; ваші власні jar-файли - ні.
cleanup.desc.modFile = Мод. Без нього збірка може не запуститися, якщо від нього залежать інші моди.
cleanup.desc.removedBin = Моди, які ви видалили; зберігаються тут, коли кошик був недоступний.
cleanup.desc.config = Налаштування модів. Видалення скине всі моди до стандартних налаштувань.
cleanup.desc.defaultconfigs = Стандартні налаштування, які модпак дає новим світам.
cleanup.desc.configEntry = Налаштування одного мода. Після видалення мод почне зі стандартних.
cleanup.desc.resourcepacks = Ресурспаки: текстури, звуки й моделі.
cleanup.desc.shaderpacks = Шейдерпаки для Iris, OptiFine чи Canvas.
cleanup.desc.packFile = Ресурспак або шейдерпак.
cleanup.desc.screenshots = Знімки екрана, зроблені в грі (F2).
cleanup.desc.screenshot = Знімок екрана.
cleanup.desc.gameLogs = Журнали гри. Корисні, коли щось падає; в інших випадках їх можна видаляти.
cleanup.desc.gameLogFile = Журнал гри.
cleanup.desc.crashReports = Звіти про збої, записані грою.
cleanup.desc.crashReport = Звіт про збій. Потрібен лише, щоб з’ясувати причину падіння гри.
cleanup.desc.options = Налаштування гри: керування, графіка, звук, увімкнені ресурспаки. Після видалення гра почне зі стандартних.
cleanup.desc.servers = Список серверів у меню мережевої гри.
cleanup.desc.scripts = Скрипти модпака (KubeJS, CraftTweaker). Без них модпак може не працювати.
cleanup.desc.schematics = Збережені споруди Litematica, WorldEdit та подібних модів.
cleanup.desc.schematicFile = Збережена споруда.
cleanup.desc.loaderCache = Кеш завантажувача модів. Відтворюється при наступному запуску.
cleanup.desc.legacyResources = Ресурси дуже старих версій, скопійовані сюди лаунчером. Відновлюються при наступному запуску.
cleanup.desc.userCache = Імена гравців, яких бачила гра. Гра створить їх знову.
cleanup.desc.bookkeeping = Запис лаунчера про те, що він тут встановив. Після видалення файли лишаться, але показуватимуться як встановлені не лаунчером.
cleanup.desc.instanceFolder = Тека, створена грою або модом.
cleanup.desc.instanceFile = Файл, створений грою або модом.
cleanup.desc.versions = Встановлені версії Minecraft, Fabric, Quilt, Forge і NeoForge.
cleanup.desc.version = Версія {0}: її маніфест і jar гри. Якщо видалити версію, яку використовує профіль, лаунчер завантажить її знову при наступному запуску.
cleanup.desc.natives = Нативні бібліотеки, розпаковані для кожної версії. Розпаковуються знову при кожному запуску версії.
cleanup.desc.nativesEntry = Нативні бібліотеки для {0}. Розпакуються знову при запуску цієї версії.
cleanup.desc.libraries = Спільне сховище Java-бібліотек, з якого беруть усі версії.
