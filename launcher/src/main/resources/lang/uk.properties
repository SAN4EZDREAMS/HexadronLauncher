cleanup.safe.partial = Незавершені завантаження
cleanup.safe.partial.tip = Шматки перерваних завантажень. Завантаження завжди починається заново, тож вони не використовуються.
cleanup.reason.partial = Незавершених файлів: {0}, старших за 15 хвилин.
cleanup.safe.versions = Невикористані версії Minecraft і завантажувачів
cleanup.safe.versions.tip = Версії, колись встановлені, які зараз не запускає жоден профіль і на яких не побудована жодна інша версія. Якщо профілю вона знову знадобиться, лаунчер завантажить її при запуску.
cleanup.reason.versions = Версій, які не використовує жоден профіль: {0}.
cleanup.safe.natives = Нативні бібліотеки видалених версій
cleanup.safe.natives.tip = Нативні бібліотеки (LWJGL, OpenAL), розпаковані для версій, що більше не використовуються. Вони розпаковуються знову щоразу, коли версія запускається.
cleanup.reason.natives = Тек для версій, які не використовує жоден профіль: {0}.
cleanup.safe.libraries = Бібліотеки, не потрібні жодній версії
cleanup.safe.libraries.tip = Java-бібліотеки, які не згадує жодна встановлена версія. Їх принесли версії чи завантажувачі, які видалили або оновили. Групи, у які пише Forge і NeoForge, зберігаються, поки хоч один із них встановлено.
cleanup.reason.libraries = Файлів, на які не посилається жодна встановлена версія: {0}.
cleanup.safe.assets = Невикористані ресурси гри
cleanup.safe.assets.tip = Звуки, текстури й мовні файли, яких немає в індексі ресурсів жодної встановленої версії - залишки видалених версій.
cleanup.reason.assets = Файлів, яких не перелічує жодна встановлена версія: {0}.
cleanup.safe.java = Невикористані середовища Java
cleanup.safe.java.tip = Середовища Java, завантажені лаунчером, яких не потребує жоден профіль. Вашу власну Java не буде зачеплено ніколи. Якщо профілю вона знадобиться, лаунчер запропонує завантажити її знову.
cleanup.reason.java = Жодному профілю не потрібні ці версії Java.
cleanup.safe.cache-modpacks = Завантажені архіви модпаків
cleanup.safe.cache-modpacks.tip = Архіви .mrpack і .zip встановлених модпаків. Модпак уже розпаковано у збірку; архів - лише копія завантаженого.
cleanup.reason.cache-modpacks = Архівів, уже розпакованих у збірки: {0}.
cleanup.safe.cache-loaders = Інсталятори Forge і NeoForge
cleanup.safe.cache-loaders.tip = Jar-інсталятори, що лишилися після встановлення Forge чи NeoForge. Вони потрібні лише для перевстановлення, і тоді завантажуються знову.
cleanup.reason.cache-loaders = Інсталяторів, чиє встановлення завершено: {0}.
cleanup.safe.cache-java = Архіви завантаженої Java
cleanup.safe.cache-java.tip = Архіви, з яких розпаковано середовища Java. Самі середовища лишаються.
