cleanup.safe.title = Рекомендоване очищення
cleanup.safe.intro = Кожна картка - це те, чим лаунчер не користується, і пояснення чому. Теки збірок - світи, моди, ресурспаки, налаштування - у цьому режимі не зачіпаються ніколи.
cleanup.safe.empty = Усе чисто: нічого зайвого не знайдено.
