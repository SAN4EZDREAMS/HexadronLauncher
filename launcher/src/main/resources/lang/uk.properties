settings.signIn.deviceCode = Кодом
settings.signIn.note = Власний браузер - це те, як має входити нативна програма: ви бачите адресний рядок і сертифікат Microsoft, а менеджер паролів і двофакторні запити працюють як завжди. Вхід кодом - для машини без придатного браузера.
settings.handshake = Передавати токен сесії через стандартний ввід
settings.handshake.note = Увімкнено за замовчуванням і має таким лишитися. Аргументи процесу може прочитати будь-яка програма на цьому комп'ютері, і вони копіюються у звіти про збій; стандартний ввід - ні. Вимикайте лише якщо завантажувач модів не стартує з цим.
settings.fileStore = Тримати дані входу у власному зашифрованому файлі лаунчера
settings.fileStore.note = Вимкнено за замовчуванням, і це погіршення: ключ до того файлу лежить поруч із ним. Опція існує тому, що заблокований або відсутній системний сховок має бути вибором, а не зависанням.
settings.dataFolder = Тека
settings.dataFolder.note = Усе, що тримає лаунчер: налаштування, акаунти, профілі, спільне сховище бібліотек і ресурсів, теки збірок і значки збірок.
settings.logs = Журнал лаунчера
settings.logs.note = Що робив лаунчер: один файл на запуск, поруч зберігаються п'ять попередніх. Облікові дані вирізаються при записі, тож файл безпечно долучати до звіту про помилку. Гра веде власний журнал у теці збірки; лаунчер записує цей шлях щоразу, коли її запускає.
log.gameLog = Гра пише власний журнал у {0}

