settings.signIn.deviceCode = Кодом
settings.signIn.note = Власний браузер - це те, як має входити нативна програма: ви бачите адресний рядок і сертифікат Microsoft, а менеджер паролів і двофакторні запити працюють як завжди. Вхід кодом - для машини без придатного браузера.
