grid.newGroupHere.occupants.body = У цьому ряді є збірки ({0}).\n\nНова група може взяти їх собі, або вони переїдуть з її шляху у вільні клітинки, що не належать жодній групі. Якщо їх нема куди подіти, сітка отримає ще один ряд.
