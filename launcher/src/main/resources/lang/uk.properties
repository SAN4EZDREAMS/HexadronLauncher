cleanup.notice.shared = Цю теку даних використовує також офіційний лаунчер, тому версії, бібліотеки й ресурси не пропонуються: їх можуть запускати інші програми.
cleanup.notice.unresolved = Версію щонайменше одного профілю не вдалося прочитати, тому бібліотеки й ресурси не пропонуються - невідомо, які з них потрібні цьому профілю. Встановлення або відновлення профілю це виправить.
cleanup.notice.assetsUnknown = Одна зі встановлених версій не має індексу ресурсів на диску, тому ресурси гри не пропонуються. Один запуск цієї версії це виправить.
cleanup.notice.javaUnknown = Щонайменше один профіль не має записаної версії Java, тому середовища Java не пропонуються.
cleanup.advanced.warning.title = Розширений режим: будьте дуже обережні!
cleanup.advanced.warning.body = Усе тут видаляється назавжди, без кошика. Якщо відмітити збірку, її світи чи моди, будуть знищені ваші світи, збірки й налаштування - відновити їх неможливо. Видалені версії, бібліотеки чи Java лаунчер завантажуватиме знову. Наведіть курсор на будь-який рядок, щоб дізнатися, що це, перш ніж його відмічати.
