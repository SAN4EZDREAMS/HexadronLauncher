settings.grid.note = Розмір поля інвентаря. Кожна збірка тримає свою клітинку, тому поле ніколи не змінює форму саме. Ці самі два числа можна змінювати з країв поля.
settings.grid.refusedHeader = Розмір поля не змінено
settings.grid.refusedColumns = Колонок залишилося {0}: частині збірок не було б куди переїхати. Спершу додайте ряд або перемістіть частину збірок вручну.
