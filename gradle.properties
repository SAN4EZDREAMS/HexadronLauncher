# Build environment settings.
#
# Gradle reads `org.gradle.*` properties ONLY from the root project's
# gradle.properties, from GRADLE_USER_HOME, and from the command line. The same
# keys in mod/gradle.properties were silently ignored, so the memory limit and
# the parallel/configuration-cache switches never applied. They live here now.
# mod/gradle.properties keeps only the project properties (`minecraft_version`,
# `loom_version`, ...), which are read per project and do work there.

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true

# IntelliJ IDEA is not yet fully compatible with the configuration cache, and
# Loom documents the same: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false
