# Scans the files of a published release on VirusTotal and adds the result -
# a badge and a report link for each file - to the end of the release notes.
#
# TWO WAYS TO RUN
#
# 1. Automatically, after each publication: release-launcher.yml calls this
#    workflow as the `virustotal` job - for both Release and Nightly (prerelease).
#
#    The `release: published` event does not work here: GITHUB_TOKEN creates the
#    release, and actions of this token intentionally do NOT start other
#    workflows. So the call is direct, through workflow_call.
#
# 2. Manually: Actions → virustotal → Run workflow, then enter the tag. Use this
#    for releases made before this integration, or when the last run hit the limit.
#
# REQUIREMENTS
#
# The VT_API_KEY secret (Settings → Secrets and variables → Actions) - the key of
# a free VirusTotal account. When there is no secret (for example, in a fork), the
# scan is skipped silently and the release is not affected.
#
# LIMITS
#
# Public API: 4 requests per minute, 500 per day. The script pauses between
# requests and first looks up each file by hash, so unchanged parts (the bundled
# Java, the libraries) cost one request. A release of ~16 files takes about
# 15–40 minutes and a few dozen requests.

name: virustotal

on:
  workflow_call:
    inputs:
      tag:
        description: 'Tag of the release whose files to scan'
        type: string
        required: true
    secrets:
      VT_API_KEY:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.9.8.1 or v0.9.8-nightly.42'
        type: string
        required: true

# One run per tag: two parallel runs waste the limit and race to write the
# section.
concurrency:
  group: virustotal-${{ inputs.tag }}
  cancel-in-progress: false

# Write access for exactly one thing: update the release notes.
permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-24.04
    # The script limits the analysis polling to 45 minutes; the rest is downloads
    # and pauses between requests.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          sparse-checkout: .github/scripts
      # Scan what is actually in the release, not the build artifacts: these are the
      # files that people and the launcher itself download.
      - name: download the release files
        run: |
          set -euo pipefail
          # Through the environment, not pasted into the script: a tag name can
          # contain shell characters.
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9][0-9A-Za-z.+-]*$ ]]; then
            echo "refusing tag '$RELEASE_TAG'"
            exit 1
          fi
          mkdir -p assets
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir assets
          ls -la assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
      - name: scan on virustotal and update the notes
        run: python3 .github/scripts/virustotal_scan.py assets
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
