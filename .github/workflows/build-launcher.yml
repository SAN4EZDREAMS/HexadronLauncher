# Збирає ЛИШЕ лаунчер.
#
# `--configure-on-demand` тут не косметика: без нього Gradle конфігурує ВСІ
# проєкти, тобто й :mod разом із Fabric Loom. Через це будь-яка помилка у
# mod/build.gradle валила збірку лаунчера, хоча лаунчер від мода не залежить.
# З цим прапорцем конфігурується тільки корінь і :launcher.

name: build-launcher
on:
  push:
    paths:
      - 'launcher/**'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/build-launcher.yml'
  pull_request:
    paths:
      - 'launcher/**'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/build-launcher.yml'
  workflow_dispatch:

concurrency:
  group: build-launcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: verify the launch core
        run: ./gradlew --configure-on-demand :launcher:selfCheck
      - name: build launcher
        run: ./gradlew --configure-on-demand :launcher:build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: hexadron-launcher
          path: |
            launcher/build/libs/*.jar
            launcher/build/distributions/*.zip
          if-no-files-found: error
