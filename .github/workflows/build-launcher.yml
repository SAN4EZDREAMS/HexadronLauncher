# Builds ONLY the launcher.
#
# `--configure-on-demand` is not cosmetic. Without it, Gradle configures ALL
# projects, :mod with Fabric Loom included. Because of this, any error in
# mod/build.gradle broke the launcher build, although the launcher does not
# depend on the mod. With this flag, Gradle configures only the root and :launcher.

name: build-launcher
on:
  push:
    paths:
      - 'launcher/**'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/build-launcher.yml'
  pull_request:
    paths:
      - 'launcher/**'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/build-launcher.yml'
  workflow_dispatch:

concurrency:
  group: build-launcher-${{ github.ref }}
  cancel-in-progress: true

# Minimum required permissions. By default the job token can have write access to
# the repository. This workflow needs write access nowhere, so it does not get it.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    # Otherwise a hung build uses six hours of runner time before GitHub kills it.
    # Forty-five seconds is normal; ten minutes is certainly a failure.
    timeout-minutes: 15
    steps:
      - name: checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: setup jdk
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      # Caches ~/.gradle/wrapper/dists, so the distribution downloads only on a cache
      # miss - after a Gradle version change or a cache eviction. That miss is where the
      # build failed: the connection dropped during the download. The number of attempts
      # is set in gradle/wrapper/gradle-wrapper.properties, together with the reason.
      - name: setup gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      # A separate step, although one `assemble` could do it all: when this step turns
      # red, it is clear that the core logic is broken, not the compilation.
      #
      # One caveat: this is the FIRST step that runs ./gradlew, so a failed download of
      # the Gradle distribution also fails here - and it looks like a broken core,
      # although the stack trace shows org.gradle.wrapper.Download, not our code.
      # LICENCE HEADERS - THE FIRST STEP, BEFORE ANY BUILD
      #
      # Every source file must start with the block from tools/license-header.txt.
      # When a block is removed or rewritten anywhere, the build fails HERE and names
      # the files. This is not about style: the header carries the authorship and the
      # licence terms, and removing it "along with" some other edit must not be silent.
      #
      # This check runs before everything else on purpose: there is no point in
      # compiling and packaging code that already breaks the project licence.
      - name: verify the licence headers
        run: ./gradlew --configure-on-demand :launcher:licenseHeaders
      - name: verify the launch core
        run: ./gradlew --configure-on-demand :launcher:selfCheck
      # `assemble`, not `build`. `build` = `assemble` + `check`, and `check` pulls in
      # selfCheck - so the previous step would run twice. JavaExec declares no outputs,
      # so Gradle does not skip it as UP-TO-DATE.
      #
      # The CurseForge key comes ONLY from here; it is not in the repository.
      # GitHub does not give secrets to fork builds or to pull requests from forks. So
      # there CURSEFORGE_API_KEY is empty, the jar manifest gets an empty attribute,
      # CurseForgeProvider.isAvailable() returns false, and CurseForge simply disappears
      # from the UI. The build stays green: an outside contribution must not fail
      # because our key is missing.
      - name: assemble launcher
        run: ./gradlew --configure-on-demand :launcher:assemble
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      # This is NOT a ready client. It is a jar plus a distZip with launch scripts - both
      # need an installed Java 25. The `package` job below builds the ready clients
      # with a bundled runtime.
      #
      # It stays here on purpose: a person who already has a JDK does not need an extra
      # 80 MB runtime, and Linux users often want exactly this option.
      - name: capture the jar and the script distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hexadron-launcher-jar
          path: |
            launcher/build/libs/*.jar
            launcher/build/distributions/*.zip
          if-no-files-found: error
          # An intermediate artifact of every push. The default of ninety days means storage
          # for hundreds of builds that nobody needs after a week.
          retention-days: 14

  # Ready clients for three systems.
  #
  # `needs: build` - the three builds start ONLY after selfCheck and compilation
  # pass. There is no point in packaging code that does not build.
  #
  # Why three separate runners, not one: jpackage can build an image only for the
  # system it runs on. It puts the Java runtime of that platform inside, so it is
  # not possible at all to build a Windows client on Linux.
  #
  # fail-fast: false - so that a macOS failure does not take down the Windows and
  # Linux builds that are already done. Each platform fails and is fixed separately.
  #
  # Packaging runs on EVERY push, in any branch. This costs about three minutes of
  # runner time on three machines, and one day that will be too much - then put
  # back the `if:` that skips packaging for work branches:
  #
  #   if: >-
  #     github.event_name == 'workflow_dispatch'
  #     || startsWith(github.ref, 'refs/tags/')
  #     || github.ref_name == github.event.repository.default_branch
  #
  # One warning for the future: the "Re-run" button keeps the original `push`
  # event, so it does NOT count as `workflow_dispatch`. For the first condition to
  # apply, use "Run workflow".
  package:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            label: windows
          - os: ubuntu-24.04
            label: linux
          - os: macos-15
            label: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # bash on all three, Windows included: then ./gradlew is one command, not
    # ./gradlew.bat in one place and ./gradlew in the other two.
    defaults:
      run:
        shell: bash
    steps:
      - name: checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: setup jdk
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      # appImage depends only on the jar, not on check. selfCheck does not run again
      # here - the build job already passed it.
      # LICENCE HEADERS - THE FIRST STEP, BEFORE ANY BUILD
      #
      # Every source file must start with the block from tools/license-header.txt.
      # When a block is removed or rewritten anywhere, the build fails HERE and names
      # the files. This is not about style: the header carries the authorship and the
      # licence terms, and removing it "along with" some other edit must not be silent.
      #
      # This check runs before everything else on purpose: there is no point in
      # compiling and packaging code that already breaks the project licence.
      - name: verify the licence headers
        run: ./gradlew --configure-on-demand :launcher:licenseHeaders
      - name: build the application image
        run: ./gradlew --configure-on-demand :launcher:appImage
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      # WHY WINDOWS AND THE OTHERS ARE PACKAGED DIFFERENTLY
      #
      # actions/upload-artifact ALWAYS gives the download as a .zip - this cannot be
      # configured. So anything we archive here ourselves, the user gets archived
      # TWICE: a zip inside a zip. That is exactly what happened on Windows before.
      #
      # Windows: we make no archive of our own at all. We upload the image folder as
      # it is, and the only archive is the one GitHub makes itself. File permissions
      # do not matter on Windows, and the image has no symlinks - nothing is lost.
      #
      # Linux and macOS: the tar.gz stays, and the double packaging there is a
      # deliberate cost. The GitHub zip does not keep the executable bit or symlinks,
      # and on these two systems the loss of either gives an image that does not
      # start: the executable must stay executable, and a .app on macOS contains
      # symlinks to the bundled runtime. An archive made without them breaks on the
      # user's machine, not in CI.
      #
      # The note file next to the folder is also needed for a technical reason: the
      # artifact root is the common parent of all added files. Without it, the archive
      # would hold the CONTENTS of HexadronLauncher/, spread across the downloads
      # folder, not the folder itself.
      - name: prepare the client for upload
        run: |
          mkdir -p release
          if [ "${{ matrix.label }}" = "windows" ]; then
            cp -r launcher/build/jpackage/HexadronLauncher release/HexadronLauncher
            printf '%s\n' \
              'HexadronLauncher' \
              '' \
              'Unpack this folder anywhere and run HexadronLauncher.exe inside it.' \
              'Java is not required: a runtime is bundled.' \
              > release/HOW-TO-RUN.txt
          else
            tar czf "release/HexadronLauncher-${{ matrix.label }}.tar.gz" \
              -C launcher/build/jpackage .
          fi
      - name: capture the client
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hexadron-launcher-${{ matrix.label }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

  # The Linux image as a Flatpak bundle, per push, so a change that breaks the
  # sandbox shows up here rather than on release day.
  flatpak:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: fetch the linux client
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: hexadron-launcher-linux
          path: linux
      - name: install the flatpak tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder appstream desktop-file-utils
          # Ubuntu 24.04 keeps unprivileged user namespaces from programs that
          # have no AppArmor profile, and bubblewrap - which flatpak-builder runs
          # every build step in - cannot sandbox anything without one.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: build the flatpak
        run: |
          set -euo pipefail
          base=$(grep -m1 -oP "(?<=\?: ')[0-9][^']*" launcher/build.gradle)
          mkdir -p release
          bash launcher/packaging/flatpak/build-flatpak.sh \
            linux/HexadronLauncher-linux.tar.gz "${base}-ci.${{ github.run_number }}" release
      - name: capture the flatpak
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hexadron-launcher-flatpak
          path: release/HexadronLauncher-linux.flatpak
          if-no-files-found: error
          retention-days: 30
