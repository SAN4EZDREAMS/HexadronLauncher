# Builds ONLY the mod.
#
# The set of optimisation mods (Sodium, Lithium, ...) is intentionally NOT enabled
# here. Only runClient needs it, and the -Phexadron.devMods=true flag controls it.
# Otherwise a green build of our code would depend on Modrinth being available.

name: build-mod
on:
  push:
    paths:
      - 'mod/**'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/build-mod.yml'
  pull_request:
    paths:
      - 'mod/**'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/build-mod.yml'
  workflow_dispatch:

concurrency:
  group: build-mod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build mod
        run: ./gradlew --configure-on-demand :mod:build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: hexadron-optimise-jar
          path: mod/build/libs/*.jar
          if-no-files-found: error
