# Збирає ЛИШЕ мод, і лише якщо змінились файли всередині mod/
# (або сам цей workflow-файл). Зміни в launcher/ чи README цей build не запускають.

name: build-mod
on:
  push:
    paths:
      - 'mod/**'
      - '.github/workflows/build-mod.yml'
  pull_request:
    paths:
      - 'mod/**'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build mod
        run: ./gradlew :mod:build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: hexadron-optimise-jar
          path: mod/build/libs/*.jar
