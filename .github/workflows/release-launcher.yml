# Publishes the ready clients as GitHub releases - the place the launcher updates
# itself from.
#
# TWO CHANNELS, ONE LIST OF RELEASES
#
# Release  - a tag like v0.9.5. A normal release, not a prerelease.
# Nightly  - a tag like v0.9.5-nightly.<run number>, marked as prerelease.
#
# The launcher reads the same list and filters it by channel: the Release channel
# takes only non-prereleases, the Nightly channel takes the newest of all. The
# launcher compares tags, so the -nightly.N suffix is required and must always
# increase: 0.9.5-nightly.42 is newer than 0.9.5-nightly.41 and OLDER than 0.9.5.
#
# FILE NAMES ARE A CONTRACT
#
# ReleaseFeed.matches() finds the file for its system by name:
#   HexadronLauncher-windows.zip
#   HexadronLauncher-linux.tar.gz
#   HexadronLauncher-macos.tar.gz
# Rename them here, and the update silently stops finding the build for a system.
#
# UPDATES IN PARTS
#
# Next to the full archive, each build also publishes a description of itself:
#   HexadronLauncher-<system>.manifest.json       - each image file with SHA-256
#   HexadronLauncher-parts-<token>-runtime.<ext>  - the bundled Java
#   HexadronLauncher-parts-<token>-libs.<ext>     - JavaFX and the other dependencies
#   HexadronLauncher-parts-<token>-app.<ext>      - the launcher's own jar
#   HexadronLauncher-parts-<token>-base.<ext>     - the executable and the root
#
# The token is win / lnx / darwin, and it is NOT the same word as in the full
# archive. This is intentional: launchers that people already have found their
# archive by the rule "the name contains windows and ends with .zip", so a part
# named HexadronLauncher-windows-app.zip became a "new version" for them, and the
# update failed with "the downloaded archive holds no application image". It is
# not possible to fix this in launchers that are already installed - the only
# option is to never publish a part under a name that their rule recognises.
#
# The launcher takes from the manifest the parts whose files it does not have yet
# (it compares BY HASH, not by name or date), copies the rest from its own folder,
# and then checks the assembled image against the manifest file by file. When
# there is no manifest, it cannot be read, or even one hash does not match, the
# launcher downloads the full archive, as before. So the names above are a
# contract too: ManifestTool writes them, and it is the single source of truth
# about which file belongs to which part.
#
# The workflow makes the archives itself, not upload-artifact: files are added to
# the release as they are, so the double packaging that gave Windows a zip inside
# a zip does not happen here at all. tar stays required on Linux and macOS - zip
# does not keep the executable bit and symlinks, and the image does not start
# without them.

name: release-launcher

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Which channel to publish'
        type: choice
        required: true
        default: nightly
        options: [nightly, release]
  # A nightly build once a day. When there was no commit in the last day, the check
  # step stops the run - nobody needs forty releases of the same code.
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: release-launcher-${{ github.ref }}
  cancel-in-progress: false

# Write access is needed for exactly one thing: create the release and put the files in it.
permissions:
  contents: write

jobs:
  # What we publish and under which tag. Decided once, so that the three builds do
  # not each calculate it in their own way.
  plan:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      version: ${{ steps.decide.outputs.version }}
      prerelease: ${{ steps.decide.outputs.prerelease }}
      proceed: ${{ steps.decide.outputs.proceed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: decide what is being published
        id: decide
        run: |
          set -euo pipefail
          base=$(grep -m1 -oP "(?<=\?: ')[0-9][^']*" launcher/build.gradle)
          echo "base version: $base"

          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF#refs/tags/}"
            version="${tag#v}"
            # A tag with a hyphen is an unstable version by definition.
            case "$tag" in *-*) pre=true;; *) pre=false;; esac
            proceed=true
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] \
               && [ "${{ inputs.channel }}" = "release" ]; then
            version="$base"
            tag="v$base"
            pre=false
            proceed=true
          else
            version="${base}-nightly.${{ github.run_number }}"
            tag="v${version}"
            pre=true
            proceed=true
            if [ "${{ github.event_name }}" = "schedule" ]; then
              # Commits in the last day. No commits - no nightly build.
              if [ -z "$(git log --since='24 hours ago' --oneline)" ]; then
                echo "no changes in the last day, skipping the nightly build"
                proceed=false
              fi
            fi
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"
          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.proceed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            label: windows
          - os: ubuntu-24.04
            label: linux
          - os: macos-15
            label: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v6
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      # LICENCE HEADERS - THE FIRST STEP, BEFORE ANY BUILD
      #
      # Every source file must start with the block from tools/license-header.txt.
      # When a block is removed or rewritten anywhere, the build fails HERE and names
      # the files. This is not about style: the header carries the authorship and the
      # licence terms, and removing it "along with" some other edit must not be silent.
      #
      # This check runs before everything else on purpose: there is no point in
      # compiling and packaging code that already breaks the project licence.
      - name: verify the licence headers
        run: ./gradlew --configure-on-demand :launcher:licenseHeaders
      # The core is checked once, on Linux: it is the same on all three systems.
      - name: verify the launch core
        if: matrix.label == 'linux'
        run: ./gradlew --configure-on-demand :launcher:selfCheck -PlauncherVersion=${{ needs.plan.outputs.version }}
      - name: build the application image
        run: ./gradlew --configure-on-demand :launcher:appImage -PlauncherVersion=${{ needs.plan.outputs.version }}
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      # The launcher itself reads the names below. See the comment at the top.
      - name: pack the client
        run: |
          set -euo pipefail
          mkdir -p release
          cd launcher/build/jpackage
          if [ "${{ matrix.label }}" = "windows" ]; then
            7z a -tzip -mx=5 "$GITHUB_WORKSPACE/release/HexadronLauncher-windows.zip" HexadronLauncher >/dev/null
          else
            tar czf "$GITHUB_WORKSPACE/release/HexadronLauncher-${{ matrix.label }}.tar.gz" .
          fi
      # BUILD DESCRIPTION AND ITS PARTS
      #
      # ManifestTool writes the manifest - the same code the launcher later reads it
      # with. It also decides which file belongs to which part, and writes lists of
      # names next to it. tar and 7z pack these lists, because they already pack the
      # full archive in the step above and can keep symlinks and the executable bit.
      - name: describe the build and pack its parts
        run: |
          set -euo pipefail
          # $PWD, not $GITHUB_WORKSPACE: on Windows the latter is a path with backslashes
          # (D:\a\...), and in bash on this machine a backslash is an escape character.
          root="$PWD"
          label="${{ matrix.label }}"
          out="$root/manifest"
          if [ "$label" = "windows" ]; then
            archive="$root/release/HexadronLauncher-windows.zip"
          else
            archive="$root/release/HexadronLauncher-$label.tar.gz"
          fi
          # The image is the only folder inside build/jpackage; on macOS it is the .app.
          image=$(ls -d launcher/build/jpackage/*/ | head -1)
          image="${image%/}"
          echo "image: $image"

          java -cp "launcher/build/libs/*" \
            com.hexadron.launcher.update.ManifestTool \
            "$root/$image" "$label" "${{ needs.plan.outputs.version }}" \
            "$out" "$archive" "$(basename "$archive")"

          # Each list has the name of the file it must become. Only ManifestTool decides
          # what the parts are called: here we only remove ".list" and pack by extension.
          cd "$root/$image"
          for list in "$out"/*.list; do
            [ -s "$list" ] || continue
            name=$(basename "$list" .list)
            case "$name" in
              *.zip)    7z a -tzip -mx=5 "$root/release/$name" "@$list" >/dev/null ;;
              *.tar.gz) tar czf "$root/release/$name" -T "$list" ;;
              *) echo "unknown extension: $name"; exit 1 ;;
            esac
          done
          cp "$out"/HexadronLauncher-*.manifest.json "$root/release/"
          ls -la "$root/release"
      - uses: actions/upload-artifact@v7
        with:
          name: client-${{ matrix.label }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  # The Linux client wrapped as a Flatpak: the same application image, in a
  # sandbox on the GNOME runtime, as one file that installs on any distribution
  # with Flatpak. Built from the image the build job already made, so what is
  # inside is byte for byte the tar.gz users download.
  flatpak:
    needs: [plan, build]
    if: needs.plan.outputs.proceed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          name: client-linux
          path: linux
      - name: install the flatpak tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder appstream desktop-file-utils
          # Ubuntu 24.04 keeps unprivileged user namespaces from programs that
          # have no AppArmor profile, and bubblewrap - which flatpak-builder runs
          # every build step in - cannot sandbox anything without one.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: build the flatpak
        run: |
          set -euo pipefail
          mkdir -p release
          bash launcher/packaging/flatpak/build-flatpak.sh \
            linux/HexadronLauncher-linux.tar.gz "${{ needs.plan.outputs.version }}" release
      - uses: actions/upload-artifact@v7
        with:
          name: client-flatpak
          path: release/HexadronLauncher-linux.flatpak
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [plan, build, flatpak]
    # A failed Flatpak must not hold back the three clients that did build: the
    # release goes out without it, and the flatpak job shows red on its own.
    if: always() && needs.plan.outputs.proceed == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      # Full history: the release notes are the list of commits since the previous
      # release, and a shallow clone does not have that range.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v6
        with:
          path: downloaded
          merge-multiple: true
      - name: list what will be published
        run: ls -la downloaded
      # The release notes are what the user reads in the update window. For a pushed
      # tag, take the tag message if there is one; for a nightly build, take the list
      # of commits since the previous release.
      - name: write the notes
        id: notes
        run: |
          set -euo pipefail
          previous=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' || true)
          {
            if [ -n "$previous" ]; then
              echo "Changes since $previous:"
              echo
              git log --pretty='- %s' "$previous..HEAD" 2>/dev/null | head -50 || true
            else
              git log --pretty='- %s' -20
            fi
          } > notes.md
          # Empty notes would look like a launcher error in the update window.
          [ -s notes.md ] || echo "- no description" > notes.md
          # A placeholder until the virustotal job writes the real result: a grey
          # "scan in progress" badge. The script replaces everything between the two
          # comments, and for verdict=pending the launcher shows its own banner -
          # see MARK_START in .github/scripts/virustotal_scan.py and
          # update/ScanReport.java. Without the key there is no scan, so the notes must
          # not promise one.
          if [ -n "${VT_API_KEY:-}" ]; then
            {
              echo
              echo '<!-- virustotal:start verdict=pending found=0 checked=0 total=0 -->'
              echo
              echo '---'
              echo
              echo '![VirusTotal: scan in progress](https://img.shields.io/badge/VirusTotal-scan%20in%20progress%20%C2%B7%2015%E2%80%9340%20min-9e9e9e?logo=virustotal&logoColor=white)'
              echo
              echo '<!-- virustotal:end -->'
            } >> notes.md
          fi
          cat notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
      - name: publish the release
        run: |
          set -euo pipefail
          flags=""
          if [ "${{ needs.plan.outputs.prerelease }}" = "true" ]; then
            flags="--prerelease"
          fi
          # The three full archives are required: without them there is nothing to update
          # with. Parts and manifests are added with the same pattern, so a new part does
          # not need a change to this step.
          for required in \
            downloaded/HexadronLauncher-windows.zip \
            downloaded/HexadronLauncher-linux.tar.gz \
            downloaded/HexadronLauncher-macos.tar.gz; do
            [ -f "$required" ] || { echo "missing $required"; exit 1; }
          done
          # Overwrite the same tag, so that a repeated run does not fail.
          gh release delete "${{ needs.plan.outputs.tag }}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "${{ needs.plan.outputs.tag }}" \
            --title "HexadronLauncher ${{ needs.plan.outputs.version }}" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            $flags \
            downloaded/HexadronLauncher-*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # About thirty nightly builds collect in a month, and nobody needs any of them
      # after the next one. The last five stay, in case a rollback to yesterday's
      # build is necessary.
      - name: prune old nightlies
        if: needs.plan.outputs.prerelease == 'true'
        run: |
          set -euo pipefail
          gh release list --limit 100 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease) | .tagName][5:] | .[]' \
            | while read -r old; do
                echo "deleting $old"
                gh release delete "$old" --yes --cleanup-tag || true
              done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # VIRUSTOTAL SCAN - AFTER PUBLICATION, NOT BEFORE
  #
  # Each release and each nightly build (prerelease) goes through VirusTotal, and a
  # badge and a report link for each file are added to the end of the release
  # notes. All the logic is in virustotal.yml; the same workflow can be run
  # manually for an old tag.
  #
  # A separate job after publish, on purpose: the analysis takes from a few minutes
  # to half an hour, and the release must not wait for it. A red virustotal job (a
  # detection or a failure) does not remove the release - it only shows that
  # somebody must take a look.
  virustotal:
    needs: [plan, publish]
    if: always() && needs.publish.result == 'success'
    permissions:
      contents: write
    uses: ./.github/workflows/virustotal.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}
    secrets:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
