plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

base {
	archivesName = 'hexadron-optimise'
}

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"hexadron-optimise" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file.
	//
	// Minecraft 26.1 is the first unobfuscated version. From it on the
	// `net.fabricmc.fabric-loom` plugin performs no remapping, so the `mod*`
	// configurations (modImplementation, modCompileOnly, modRuntimeOnly, ...)
	// do not exist: plain `implementation` / `compileOnly` / `runtimeOnly` are
	// the correct ones, and `jar` replaces `remapJar`. The `mod*` names survive
	// only in `net.fabricmc.fabric-loom-remap`, which targets 1.21.11 and older.
	//
	// Using modImplementation here is what produced
	//   "Could not find method modImplementation() ... on DefaultDependencyHandler".
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

// The optimisation set, for the development environment only.
//
// Off by default. `./gradlew :mod:build` must not depend on the Modrinth API
// being reachable, or on seven third-party builds still existing under the
// exact ids pinned below - that couples a green build of our own code to other
// projects' release hygiene. Turn it on when you want `runClient` to start with
// the whole set loaded:
//
//     ./gradlew :mod:runClient -Phexadron.devMods=true
//
// The authoritative list is not here. It is
// launcher/src/main/resources/packs/hexadron-optimise.json, which the launcher
// reads at runtime and which can be edited without rebuilding anything. The
// ids below are the same projects, pinned to the builds used for development.
//
// Nothing is wrapped in `include`. `include` would bundle other people's mods
// inside hexadron-optimise.jar, which is redistribution and a per-mod licensing
// question rather than a build setting. The launcher downloads them instead.
if (providers.gradleProperty('hexadron.devMods').getOrElse('false').toBoolean()) {
	dependencies {
		runtimeOnly "maven.modrinth:AANobbMI:2Yom1N68" // Sodium
		runtimeOnly "maven.modrinth:gvQqBUqZ:UPNexAfy" // Lithium
		runtimeOnly "maven.modrinth:uXXizFIs:d5ddUdiB" // FerriteCore
		runtimeOnly "maven.modrinth:fQEb0iXm:5WeL0Nkz" // Krypton
		runtimeOnly "maven.modrinth:NNAgCjsB:iiF6U3Ne" // EntityCulling
		runtimeOnly "maven.modrinth:YL57xq9U:oaD6KQls" // Iris
		runtimeOnly "maven.modrinth:mOgUt4GM:njXb639R" // Mod Menu
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

// The class file version this jar ships as, which is a separate question from
// the JDK that builds it.
//
// It was 25, which meant the jar refused to load on any Java older than 25 -
// that is, on every Minecraft before 26.x. Nothing in this mod needs a language
// feature past 17: it is a logger, a string and two empty entrypoints. So it is
// compiled to 17 and runs everywhere, while the toolchain below stays at the
// version Loom needs to read Minecraft 26.2 in the development environment.
//
// `release` rather than source/targetCompatibility because only `release` also
// restricts the API: it is what stops a Java 21 method call from compiling
// cleanly here and failing with NoSuchMethodError on a 1.20.1 profile.
def modJavaVersion = 17

tasks.withType(JavaCompile).configureEach {
	it.options.release = modJavaVersion
}

java {
	// Loom attaches sourcesJar to the "build" task if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.toVersion(modJavaVersion)
	targetCompatibility = JavaVersion.toVersion(modJavaVersion)

	toolchain {
		// The JDK that runs javac and Loom, not the bytecode target. Minecraft
		// 26.2's own classes are Java 25, so reading them needs a 25 toolchain
		// even though nothing compiled here refers to one of them.
		languageVersion = JavaLanguageVersion.of(25)
	}
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from(rootProject.file("LICENSE")) {
		rename { "${it}_$projectName" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
		// Add repositories to publish to here.
	}
}
