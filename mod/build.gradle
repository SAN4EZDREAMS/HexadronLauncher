plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

base {
	archivesName = 'hexadron-optimise'
}

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"hexadron-optimise" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// The optimisation set.
	//
	// These MUST use modImplementation, not implementation. Loom treats a
	// modImplementation dependency as a Minecraft mod: it remaps it against the
	// current mappings and puts it into the `runClient` development environment.
	// A plain `implementation` entry only reaches the compile classpath - the
	// mods are absent at runtime, so `runClient` silently runs without them and
	// nothing here is ever actually exercised.
	//
	// These are NOT wrapped in `include`. `include` would bundle the jars inside
	// hexadron-optimise.jar (jar-in-jar), which is a redistribution of other
	// people's mods and a per-mod licensing question rather than a build setting.
	// HexadronLauncher installs this exact set from Modrinth instead - see
	// launcher/src/main/resources/packs/hexadron-optimise.json, which carries
	// the same project ids as the lines below.
	modImplementation "maven.modrinth:AANobbMI:2Yom1N68" // Sodium 0.9.1 (26.2)
	modImplementation "maven.modrinth:gvQqBUqZ:UPNexAfy" // Lithium 0.25.2 (26.2)
	modImplementation "maven.modrinth:uXXizFIs:d5ddUdiB" // FerriteCore 9.0.0 (26.2) - memory
	modImplementation "maven.modrinth:fQEb0iXm:5WeL0Nkz" // Krypton 0.3.1 (26.2) - network stack
	modImplementation "maven.modrinth:NNAgCjsB:iiF6U3Ne" // EntityCulling 1.10.5 (26.2)
	modImplementation "maven.modrinth:YL57xq9U:oaD6KQls" // Iris 1.11.2+26.2 - built against Sodium 0.9.1
	modImplementation "maven.modrinth:mOgUt4GM:njXb639R" // Mod Menu 20.0.1 (26.2)
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25

	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
		// Add repositories to publish to here.
	}
}
