# Project properties for :mod only.
#
# `org.gradle.*` build-environment keys are NOT read from a subproject
# gradle.properties - they moved to the root gradle.properties.

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.3
# Pinned, not -SNAPSHOT: gradle/verification-metadata.xml records the hash of
# exactly this Loom build. A snapshot moves to the next build on its own, and
# the build then fails verification (or, without verification, runs code nobody
# reviewed). Update it by hand, then run: ./gradlew --write-verification-metadata sha256 help
loom_version=1.17.21

# Mod Properties
version=1.0.0
group=com.hexadron.optimise

# Dependencies
fabric_api_version=0.157.0+26.2
